/* ---------- pegado inteligente ---------- */
async function procesarPegado(txt){
  txt=(txt||'').trim(); if(!txt) return;
  if(txt.startsWith('@')){ parseBibtex(txt); return; }
  const soloLiga = /^https?:\/\/\S+$/i.test(txt);
  const doi = (txt.match(/10\.\d{4,9}\/[^\s"'<>]+/)||[])[0];
  if(doi && txt.length<120){ M.banner=['lo','Buscando en Crossref…']; drawModal(); await crossref(doi.replace(/[.,;)]+$/,'')); return; }
  if(soloLiga){
    M.fuente.liga=txt; M.auto.liga=true;
    M.banner=['wa','<b>Esta liga no trae datos legibles.</b> Guárdala así — va a tu lista de fuentes pendientes y la completas otro día.'];
    drawModal(); return;
  }
  /* referencia bibliográfica ya armada */
  if(txt.length>=25 && /[.,]/.test(txt)){ parseRef(txt); return; }
  M.banner=['wa','No reconocí eso. Llena los campos a mano.']; drawModal();
}

/* ---- pegar una referencia ya hecha (Chicago, APA, la que sea) ----
   No pretende adivinar todo: llena lo que puede reconocer y GUARDA EL TEXTO
   COMPLETO, que es lo que se usa en la bibliografía si tú lo autorizas. */
function parseRef(t){
  const s=t.replace(/\s+/g,' ').trim();
  const f=M.fuente; const set=(k,v)=>{ if(v&&String(v).trim()){ f[k]=String(v).trim().replace(/[.,;]$/,''); M.auto[k]=true; } };
  f.refCruda=s; f.usarCruda=true; M.auto.refCruda=true;

  const my = s.match(/\((\d{4})[a-z]?\)/) || s.match(/,\s*(\d{4})\s*[.)\];]/) || s.match(/\b(1[5-9]\d{2}|20\d{2})\b/);
  if(my) set('anio', my[1]);
  const mu = s.match(/https?:\/\/[^\s,;)\]]+/);
  if(mu) set('liga', mu[0]);
  const md = s.match(/10\.\d{4,9}\/[^\s"'<>,;)\]]+/);
  if(md && !f.liga) set('liga','https://doi.org/'+md[0]);

  const mq = s.match(/[“"«]\s*([^”"»]{6,220})\s*[”"»]/);
  const mi = s.match(/[*_]{1,2}([^*_]{6,220})[*_]{1,2}/);
  /* el autor es todo lo que va antes del título; si el título viene entrecomillado
     o en cursivas, cortamos ahí — así no se pierde "y Fulano" tras una inicial */
  const iniT = mq? s.indexOf(mq[0]) : (mi? s.indexOf(mi[0]) : -1);
  const mAut = s.match(/^([^.]{3,140}?)\.\s/);
  if(iniT>3){
    const cand=s.slice(0,iniT).replace(/[.\s"“«]+$/,'').trim();
    if(cand.length<170 && !/^[“"«]/.test(cand)) set('autor', cand);
  } else if(mAut && /,/.test(mAut[1]) && !/^[“"«]/.test(s)) set('autor', mAut[1]);

  if(mq){ set('titulo', mq[1]); if(mi) set('revista', mi[1]); f.tipo='articulo'; }
  else if(mi){ set('titulo', mi[1]); f.tipo='libro'; }
  else { const segs=s.split(/\.\s+/);
    if(segs.length>1){ set('titulo', segs[1]);
      if(!f.autor && segs[0].length<70) set('autor', segs[0]); } }

  const mVol = s.match(/\b(\d{1,3}),?\s*(?:no\.|núm\.|nº|\()\s*(\d{1,3})/i);
  if(mVol){ set('volumen', mVol[1]); set('numero', mVol[2]); }
  const mPag = s.match(/:\s*(\d{1,4}\s*[–-]\s*\d{1,4})/);
  if(mPag) set('paginas', mPag[1].replace(/\s*[–-]\s*/,'–'));
  const mCiu = s.match(/([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑáéíóúñ .]{2,40}):\s*([^.,]{2,70}?),\s*\d{4}/);
  if(mCiu){ set('ciudad', mCiu[1]); set('editorial', mCiu[2]); if(f.tipo==='generica') f.tipo='libro'; }

  if(/\btesis\b/i.test(s)){ f.tipo='tesis';
    const mU=s.match(/(?:Tesis[^,]*,)\s*([^,.]{4,80})/i); if(mU) set('universidad', mU[1]);
    const mG=s.match(/(Tesis de [a-záéíóú]+)/i); if(mG) set('grado', mG[1]); }
  if(/youtube|youtu\.be|video de/i.test(s)) f.tipo='video';
  if(/\b(ley|norma oficial|NOM-|reglamento|código)\b/i.test(s) && f.tipo==='generica') f.tipo='ley';

  const n=Object.keys(M.auto).filter(k=>k!=='refCruda').length;
  M.banner=['ok', n
    ? `<b>Referencia guardada tal cual.</b> Además reconocí ${n} campo${n>1?'s':''} para poder ordenarla y buscarla. Revisa abajo — si algo quedó mal, no importa: la bibliografía usa el texto que pegaste.`
    : `<b>Referencia guardada tal cual.</b> No pude separarla en campos, pero se va a imprimir en la bibliografía exactamente como la pegaste.`];
  M.tipoDetectado=true;
  drawModal();
}
function parseBibtex(t){
  const tipo=(t.match(/^@(\w+)/)||[])[1]||'';
  const g=k=>{ const r=new RegExp(k+'\\s*=\\s*[{"]([^}"]*)[}"]','i'); const m=t.match(r); return m?m[1].replace(/[{}]/g,'').trim():''; };
  const map={article:'articulo',book:'libro',phdthesis:'tesis',mastersthesis:'tesis',misc:'generica',online:'sitio',inproceedings:'articulo',incollection:'capitulo',inbook:'capitulo'};
  const f=M.fuente; const auts=g('author');
  f.tipo = map[tipo.toLowerCase()]||'generica';
  const set=(k,v)=>{ if(v){ f[k]=v; M.auto[k]=true; } };
  /* la clave del propio BibTeX es la que vas a usar en el .tex */
  const clave=(t.match(/^@\w+\s*\{\s*([^,\s]+)\s*,/)||[])[1]||'';
  set('bibkey', clave);
  set('autor', auts.split(/\s+and\s+/).map(a=>a.trim()).join('; '));
  set('titulo', g('title')); set('anio', g('year'));
  if(f.tipo==='capitulo'){ set('libro', g('booktitle'));
    set('editor', g('editor').split(/\s+and\s+/).map(a=>a.trim()).join('; ')); }
  set('revista', g('journal')||(f.tipo==='capitulo'?'':g('booktitle'))); set('volumen', g('volume'));
  set('numero', g('number')); set('paginas', g('pages').replace(/--/g,'–'));
  set('editorial', g('publisher')); set('ciudad', g('address'));
  set('universidad', g('school')); set('liga', g('url')||g('doi'));
  M.auto.tipo=true;
  const n=Object.keys(M.auto).length;
  M.banner=['ok',`<b>BibTeX reconocido.</b> Se llenaron ${n} campos. Revísalos antes de guardar.`];
  drawModal();
}
async function crossref(doi){
  try{
    const r=await fetch('https://api.crossref.org/works/'+encodeURIComponent(doi));
    if(!r.ok) throw 0;
    const j=await r.json(), w=j.message, f=M.fuente;
    const set=(k,v)=>{ if(v){ f[k]=v; M.auto[k]=true; } };
    const t=w.type||'';
    f.tipo = t.includes('book')?'libro':(t.includes('journal')||t.includes('proceedings')?'articulo':'generica');
    M.auto.tipo=true;
    set('autor',(w.author||[]).map(a=>[a.family,a.given].filter(Boolean).join(', ')).join('; '));
    set('titulo',(w.title||[])[0]||'');
    set('revista',(w['container-title']||[])[0]||'');
    set('volumen',w.volume||''); set('numero',w.issue||'');
    set('paginas',(w.page||'').replace(/-/g,'–'));
    set('editorial',w.publisher||'');
    const y=((w.issued||{})['date-parts']||[[]])[0][0]; set('anio', y?String(y):'');
    set('liga', w.URL||('https://doi.org/'+doi));
    const n=Object.keys(M.auto).length;
    M.banner=['ok',`<b>Datos encontrados en Crossref.</b> Se llenaron ${n} campos. Revísalos — se equivocan poco, pero se equivocan.`];
  }catch(e){
    M.fuente.liga='https://doi.org/'+doi; M.auto.liga=true;
    M.banner=['wa','<b>No encontré ese DOI</b> (o no hay internet). Guardé la liga; los datos los pones a mano.'];
  }
  drawModal();
}

const TABLA='protocolo_sync';
/* la URL debe ser solo https://xxxx.supabase.co — si viene con /rest/v1 o
   con diagonal al final, se la quitamos en vez de fallar con un 404 */
function normUrl(u){
  return (u||'').trim().replace(/\s+/g,'')
    .replace(/\/+$/,'').replace(/\/rest\/v1$/i,'').replace(/\/+$/,'');
}
function errTxt(st){
  if(st===404) return 'HTTP 404 — no encontré la tabla. Revisa que hayas corrido el SQL en Supabase, y que la URL sea solo https://xxxx.supabase.co (sin /rest/v1).';
  if(st===401||st===403) return 'HTTP '+st+' — la key no es válida o la tabla no tiene la política de acceso abierto. Vuelve a copiar la anon public key y revisa el SQL.';
  if(st===400) return 'HTTP 400 — la tabla existe pero sus columnas no coinciden. Debe tener code, data y updated_at.';
  return 'HTTP '+st;
}
function supa(){ const s=JSON.parse(localStorage.getItem('protocolo_supa')||'{}'); s.url=normUrl(s.url); return s; }
function syncCode(){ return localStorage.getItem('protocolo_synccode')||''; }
function hdr(){ const s=supa(); return {apikey:s.key,Authorization:'Bearer '+s.key,'Content-Type':'application/json'}; }
function syncMsg(t,cls){ const e=document.getElementById('syncMsg'); if(!e)return; e.innerHTML=t; e.className='msg '+cls; }
function guardarSupa(){
  const crudo=document.getElementById('supaUrl').value;
  const url=normUrl(crudo);
  const key=document.getElementById('supaKey').value.trim();
  const code=document.getElementById('supaCode').value.trim();
  localStorage.setItem('protocolo_supa',JSON.stringify({url,key}));
  localStorage.setItem('protocolo_synccode',code);
  document.getElementById('supaUrl').value=url;
  if(!(url&&key&&code)){ syncMsg('Faltan datos: llena URL, key y código.','err'); return; }
  let m='Credenciales guardadas. Ya puedes subir o traer datos.';
  if(normUrl(crudo)!==crudo.trim()) m+=' Le quité el <code>/rest/v1</code> a la URL — la app lo agrega sola.';
  if(code.length<12) m+='<br>⚠ Tu código es corto. Cualquiera que lo adivine puede leer tus fichas: te conviene uno largo, tipo <code>valen-protocolo-2026-xk39</code>.';
  syncMsg(m,'ok');
}
function listo(){ const s=supa(); if(!s.url||!s.key||!syncCode()){ syncMsg('Primero guarda la URL, la key y el código.','err'); return false; } return true; }
async function cloudInfo(){
  if(!listo())return;
  try{
    const s=supa();
    const r=await fetch(`${s.url}/rest/v1/${TABLA}?code=eq.${encodeURIComponent(syncCode())}&select=updated_at,data`,{headers:hdr()});
    if(!r.ok) throw new Error(errTxt(r.status));
    const rows=await r.json();
    if(!rows.length){ syncMsg('La nube está vacía con ese código. Sube tus datos para empezar.','ok'); return; }
    const d=rows[0].data||{}, st=d[KEY]?JSON.parse(d[KEY]):{};
    const local=localStorage.getItem('protocolo_local_ts')||'nunca';
    syncMsg(`<b>En la nube:</b> ${(st.fichas||[]).length} fichas, ${(st.atorados||[]).length} atorados · actualizada el ${new Date(rows[0].updated_at).toLocaleString('es-MX')}<br>
      <b>Aquí:</b> ${S.fichas.length} fichas, ${S.atorados.length} atorados · guardado ${local==='nunca'?'nunca':new Date(local).toLocaleString('es-MX')}<br>
      Decide tú: subir pisa la nube, traer pisa lo de aquí.`,'ok');
  }catch(e){ syncMsg('No pude conectar. '+e.message,'err'); }
}
async function cloudPush(manual){
  if(!supa().url||!supa().key||!syncCode()){ if(manual)syncMsg('Primero guarda credenciales.','err'); return; }
  try{
    const s=supa(), ts=new Date().toISOString();
    const r=await fetch(`${s.url}/rest/v1/${TABLA}?on_conflict=code`,{method:'POST',
      headers:Object.assign({},hdr(),{Prefer:'resolution=merge-duplicates'}),
      body:JSON.stringify([{code:syncCode(),data:{[KEY]:JSON.stringify(S)},updated_at:ts}])});
    if(!r.ok) throw new Error(errTxt(r.status));
    localStorage.setItem('protocolo_remote_ts',ts);
    if(manual) syncMsg('Subido. La nube ahora tiene '+S.fichas.length+' fichas.','ok'); else toast('Sincronizado');
  }catch(e){ if(manual) syncMsg('No se pudo subir. '+e.message,'err'); }
}
async function cloudPull(manual){
  if(!listo())return;
  try{
    const s=supa();
    const r=await fetch(`${s.url}/rest/v1/${TABLA}?code=eq.${encodeURIComponent(syncCode())}&select=data,updated_at`,{headers:hdr()});
    if(!r.ok) throw new Error(errTxt(r.status));
    const rows=await r.json();
    if(!rows.length){ syncMsg('No hay nada en la nube con ese código.','err'); return; }
    const d=rows[0].data||{};
    if(!d[KEY]){ syncMsg('La fila existe pero está vacía.','err'); return; }
    if(manual && !window._confirmPull){
      window._confirmPull=true; setTimeout(()=>window._confirmPull=false,6000);
      const st=JSON.parse(d[KEY]);
      syncMsg(`<b>Esto va a reemplazar lo que tienes aquí.</b> La nube trae ${(st.fichas||[]).length} fichas; aquí tienes ${S.fichas.length}.
        Si estás segura, toca "traer de la nube" otra vez en los próximos segundos.`,'err');
      return;
    }
    S=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(d[KEY]));
    localStorage.setItem(KEY,JSON.stringify(S));
    localStorage.setItem('protocolo_remote_ts',rows[0].updated_at);
    window._confirmPull=false;
    render(); syncMsg('Datos traídos de la nube.','ok'); toast('Datos actualizados');
  }catch(e){ syncMsg('No se pudo traer. '+e.message,'err'); }
}

function porFuente(fs){
  const map={};
  fs.forEach(f=>{ const k=fuenteKey(f); if(!k) return;
    if(!map[k]) map[k]={k, s:f.fuente||{}, n:0, pal:0, aps:new Set(), tags:new Set(), conf:''};
    const g=map[k]; g.n++; g.pal+=words(f.extracto);
    if(f.apartado) g.aps.add(f.apartado);
    (f.secundarios||[]).forEach(a=>g.aps.add(a));
    (f.tags||[]).forEach(t=>g.tags.add(t));
    if(f.confiabilidad) g.conf=f.confiabilidad;
  });
  return Object.values(map);
}

let DOCS=[], docSel=null, docPag=1, dq='', _sel='';
let _db=null;
function idb(){ return new Promise((res,rej)=>{ if(_db) return res(_db);
  const r=indexedDB.open('protocolo_docs',1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('docs')) r.result.createObjectStore('docs',{keyPath:'id'}); };
  r.onsuccess=()=>{ _db=r.result; res(_db); }; r.onerror=()=>rej(r.error); }); }
async function docPut(d){ const db=await idb(); return new Promise((res,rej)=>{
  const t=db.transaction('docs','readwrite'); t.objectStore('docs').put(d);
  t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function docLoad(){ try{ const db=await idb(); DOCS=await new Promise((res,rej)=>{
  const q=db.transaction('docs','readonly').objectStore('docs').getAll();
  q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); });
  DOCS.sort((a,b)=>(b.agregado||'').localeCompare(a.agregado||'')); }catch(e){ DOCS=[]; } }
async function docBorrar(id){
  if(window._delDoc!==id){ window._delDoc=id; toast('Toca otra vez para borrar'); setTimeout(()=>window._delDoc=null,4000); return; }
  const db=await idb(); await new Promise(res=>{ const t=db.transaction('docs','readwrite');
    t.objectStore('docs').delete(id); t.oncomplete=res; });
  DOCS=DOCS.filter(d=>d.id!==id); if(docSel===id) docSel=null; render(); toast('Documento borrado');
}
function ensurePdf(){ return new Promise((res,rej)=>{
  if(window.pdfjsLib) return res();
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){} res(); };
  s.onerror=()=>rej(new Error('No se pudo cargar el lector de PDF. Revisa tu internet.'));
  document.head.appendChild(s); }); }
function dprog(t,p){ const e=document.getElementById('dprog');
  if(e) e.innerHTML=`<div class="hint">${t}</div>${p!=null?`<div class="prog"><i style="width:${p}%"></i></div>`:''}`; }
async function subirPDF(files){
  const lista=[...files].filter(f=>/\.pdf$/i.test(f.name));
  if(!lista.length){ dprog('Solo puedo transcribir archivos PDF.'); return; }
  try{ dprog('Cargando el lector…',3); await ensurePdf(); }
  catch(e){ dprog(e.message); return; }
  for(const file of lista){
    try{
      dprog('Leyendo '+file.name+'…',6);
      const buf=await file.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      const paginas=[];
      for(let i=1;i<=pdf.numPages;i++){
        const p=await pdf.getPage(i);
        const tc=await p.getTextContent();
        paginas.push(tc.items.map(it=>it.str).join(' ').replace(/[ \t]+/g,' ').trim());
        dprog(`Transcribiendo ${file.name} — página ${i} de ${pdf.numPages}`, Math.round(i/pdf.numPages*100));
      }
      const chars=paginas.join('').length;
      const doc={id:uid(), nombre:file.name, paginas, agregado:new Date().toISOString(),
        fuente:{tipo:'generica', titulo:file.name.replace(/\.pdf$/i,'')}, apartado:'', archivo:'',
        escaneado: chars < paginas.length*40};
      await docPut(doc); DOCS.unshift(doc);
      dprog(doc.escaneado
        ? `⚠ ${file.name}: casi no traía texto. Probablemente es un PDF escaneado (imágenes). Se guardó, pero va a estar vacío — para ese necesitarías OCR.`
        : `✓ ${file.name}: ${pdf.numPages} páginas transcritas, ${chars.toLocaleString('es-MX')} caracteres.`);
    }catch(e){ dprog('No pude leer '+file.name+': '+e.message); }
  }
  render();
}

  const d=DOCS.find(x=>x.id===id); if(!d) return;

/* =========================================================
   REDACCIÓN PROGRESIVA POR APARTADO
   El texto vive en un contenteditable. Las citas son <sup> atómicos
   con el id de la ficha adentro; el NÚMERO no se guarda nunca — se
   calcula por orden de aparición en cada repintado. Por eso mover,
   borrar o insertar una cita en medio renumera solo y no se puede romper.
   ========================================================= */
let _tAuto=null, _rango=null, _apEdit=null;

function red(ap){ S.redacciones=S.redacciones||{}; return S.redacciones[ap]||{html:'',ts:''}; }
function setRed(ap,html){
  S.redacciones=S.redacciones||{};
  S.redacciones[ap]={html, ts:new Date().toISOString()};
}
/* deja solo texto, saltos de párrafo y las citas */
function limpiaHTML(raw){
  const d=document.createElement('div'); d.innerHTML=raw||'';
  const out=document.createElement('div');
  (function walk(nodo, destino){
    nodo.childNodes.forEach(n=>{
      if(n.nodeType===3){ destino.appendChild(document.createTextNode(n.nodeValue)); return; }
      if(n.nodeType!==1) return;
      const t=n.tagName;
      if(t==='SCRIPT'||t==='STYLE'||t==='NOSCRIPT') return;   /* nunca se copia código pegado */
      if(t==='SUP' && n.dataset && n.dataset.f){
        const s=document.createElement('sup');
        s.dataset.f=n.dataset.f; if(n.dataset.p) s.dataset.p=n.dataset.p;
        s.contentEditable='false'; s.textContent='0';
        destino.appendChild(s); return;
      }
      if(t==='BR'){ destino.appendChild(document.createElement('br')); return; }
      if(t==='DIV'||t==='P'){ const p=document.createElement('div'); destino.appendChild(p); walk(n,p); return; }
      walk(n, destino);
    });
  })(d, out);
  return out.innerHTML;
}
function palabrasDe(html){
  const d=document.createElement('div'); d.innerHTML=html||'';
  d.querySelectorAll('sup').forEach(s=>s.remove());
  return words(d.textContent);
}
function palabrasRed(ap){ return palabrasDe(red(ap).html); }

function renumerar(cont){
  if(!cont) return;
  [...cont.querySelectorAll('sup[data-f]')].forEach((el,i)=>{
    el.contentEditable='false';
    if(el.textContent!==String(i+1)) el.textContent=String(i+1);
  });
}
/* las notas del apartado: completa la primera vez que sale la fuente, abreviada después */
function notasDe(html){
  const d=document.createElement('div'); d.innerHTML=html||'';
  const sups=[...d.querySelectorAll('sup[data-f]')];
  const vistas={}, notas=[], usadas={};
  sups.forEach((el,i)=>{
    const f=S.fichas.find(x=>x.id===el.dataset.f);
    if(!f){ notas.push({n:i+1, html:'<span style="color:var(--warn)">La ficha de esta cita ya no existe.</span>', falta:true}); return; }
    const s=f.fuente||{}, k=fuenteKey(f);
    const pag = el.dataset.p || f.pagina || '';
    const primera = !vistas[k]; vistas[k]=1;
    if(k) usadas[k]=s;
    notas.push({n:i+1, html: primera? chicagoNota(s,pag) : chicagoNotaCorta(s,pag), fid:f.id});
  });
  const bib=Object.values(usadas).sort((a,b)=>
    (a.autor||a.refCruda||'zzz').localeCompare(b.autor||b.refCruda||'zzz','es'));
  return {notas, bib};
}
function guardarEditor(){
  const ed=document.getElementById('edRed'); if(!ed||!_apEdit) return;
  renumerar(ed);
  setRed(_apEdit, limpiaHTML(ed.innerHTML));
  save(); schedulePush();
  const av=document.getElementById('edAviso'); if(av) av.textContent='guardado';
  pintarNotas();
}
function autoguardar(){
  const av=document.getElementById('edAviso'); if(av) av.textContent='escribiendo…';
  clearTimeout(_tAuto); _tAuto=setTimeout(guardarEditor, 600);
}
function pintarNotas(){
  if(!_apEdit) return;
  const cont=document.getElementById('edNotas'); if(!cont) return;
  const ed=document.getElementById('edRed');
  const {notas,bib}=notasDe(ed? ed.innerHTML : red(_apEdit).html);
  const pal = ed? palabrasDe(ed.innerHTML) : palabrasRed(_apEdit);
  const e=ex(_apEdit), metaPal=Math.round(e.ideal*(S.ajustes.ppc||300));
  const cu=Math.round(pal/(S.ajustes.ppc||300)*100)/100;
  const m=document.getElementById('edMedidor');
  if(m) m.innerHTML=`<b>${pal.toLocaleString('es-MX')}</b> palabras · <b>${cu}</b> de ${e.ideal} cuartillas
    <span class="bar" style="max-width:160px"><i style="width:${Math.min(pal/Math.max(metaPal,1),1)*100}%"></i></span>`;
  cont.innerHTML = `
    <div class="edsec">Notas <span class="r">${notas.length} en este apartado</span></div>
    ${notas.length?`<ol class="notas">${notas.map(n=>`<li>${n.html}</li>`).join('')}</ol>`
      :'<div class="hint">Todavía no insertas citas. Pon el cursor donde quieras una y toca <b>insertar cita</b>.</div>'}
    <div class="edsec" style="margin-top:22px">Bibliografía <span class="r">${bib.length} fuente${bib.length===1?'':'s'} usada${bib.length===1?'':'s'}</span></div>
    ${bib.length?`<div>${bib.map(s=>`<div class="bibl">${chicago(s)}</div>`).join('')}</div>`
      :'<div class="hint">Se arma sola con las fuentes que cites arriba.</div>'}`;
}
function montarEditor(ap){
  const ed=document.getElementById('edRed'); if(!ed) return;
  _apEdit=ap;
  ed.innerHTML = red(ap).html || '';
  renumerar(ed);
  ed.oninput=()=>{ renumerar(ed); autoguardar(); };
  ed.onblur=()=>{ recordarRango(); guardarEditor(); };
  ed.onkeyup=recordarRango; ed.onmouseup=recordarRango;
  ed.onpaste=(e)=>{ e.preventDefault();
    const t=(e.clipboardData||window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, t); };

    </div>
    <div class="mfoot"><span class="hint">La página de la nota sale de la ficha. Si la ficha no tiene página, la nota va sin ella.</span></div>
   </div></div>`;
  const i=document.getElementById('ciIn'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); }

function insertarCita(fid){
  const f=S.fichas.find(x=>x.id===fid); if(!f) return;
  const ed=document.getElementById('edRed');

     <div class="chips" style="margin-top:11px">
       <button class="chip ${a.texto?'on':''}" onclick="setAv('texto',${a.texto?'false':'true'});render()">
         ${a.texto?'✓ ':''}incluir el texto redactado</button>
       <button class="chip ${a.borradores?'on':''}" onclick="setAv('borradores',${a.borradores?'false':'true'});render()">
         ${a.borradores?'✓ ':''}incluir mis notas sueltas</button>
     </div>
     <div class="hint" style="margin-top:7px">Salen marcadas como borrador propio, para que no se confundan con una cita.</div>
   </div>

   <div class="pv-prep">
     <div class="h">Dónde voy <span style="text-transform:none;letter-spacing:0;font-weight:300;color:var(--muted)">— escríbelo tú, en tu voz</span></div>
     <textarea class="in tall" style="min-height:130px" placeholder="Qué hiciste, qué encontraste que valga la pena, qué te falta y qué sigue. Tres o cuatro párrafos cortos. Es lo único que la maestra va a leer completo."
       oninput="setAv('dondeVoy',this.value)">${esc(a.dondeVoy)}</textarea>
     <div class="hint" style="margin-top:6px">Un párrafo por renglón en blanco. Si lo dejas vacío, esa página no aparece.</div>
   </div>

   <div class="pv-prep">
     <div class="h">Asesorías <span style="text-transform:none;letter-spacing:0;font-weight:300;color:var(--muted)">— lo que dijo la maestra y a qué te comprometiste</span></div>
     ${ASE().length?ASE().map((x,ix)=>`
       <div style="border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:10px;${ix===0?'border-color:var(--accent)':''}">
         <div style="display:flex;gap:9px;align-items:center;margin-bottom:9px;flex-wrap:wrap">
           <input class="in" type="date" style="width:150px" value="${esc(x.fecha)}" onchange="setAse('${x.id}','fecha',this.value)">
           ${ix===0?'<span class="tg on">la que estás preparando</span>':'<span class="tg off">anterior</span>'}
           <span class="sp"></span>
           <button class="hint" style="color:var(--muted)" onclick="delAse('${x.id}')">borrar</button>
         </div>
         <div class="fld"><label>Qué dijo la maestra</label>
           <textarea class="in auto" placeholder="Textual o parafraseado, pero con lo que de verdad dijo. Tú lo vas a releer en dos meses."
             oninput="setAse('${x.id}','retro',this.value);autoAlto(this)">${esc(x.retro)}</textarea></div>
         <div class="fld" style="margin-bottom:0"><label>A qué me comprometí</label>
           ${(x.compromisos||[]).map((c,i)=>`
             <div style="display:flex;gap:7px;align-items:flex-start;margin-bottom:7px">
               <button class="tg ${c.estado==='hecho'?'on':(c.estado==='no'?'':'off')}" style="flex:none;margin-top:3px"
                 onclick="cicloComp('${x.id}',${i})" title="cambiar estado">${COMPLBL[c.estado]}</button>
               <textarea class="in auto" style="flex:1" placeholder="Tener listo…"
                 oninput="setComp('${x.id}',${i},'txt',this.value);autoAlto(this)">${esc(c.txt)}</textarea>
               <select class="in" style="width:132px;flex:none" onchange="setComp('${x.id}',${i},'apartado',this.value)">
                 <option value="">sin apartado</option>
                 ${RUTA.map(r=>`<option value="${r.id}" ${c.apartado===r.id?'selected':''}>${r.id}</option>`).join('')}
               </select>
               <button class="hint" style="flex:none;margin-top:5px;color:var(--muted)" onclick="delComp('${x.id}',${i})">✕</button>
             </div>`).join('')}
           <button class="btn o sm" onclick="addCompromiso('${x.id}')">+ compromiso</button>
         </div>
       </div>`).join('')
     :'<div class="hint" style="margin-bottom:10px">Todavía no registras ninguna asesoría. Registra una antes de ir a clase para tener dónde anotar, y otra después con lo que te dijo.</div>'}
     <button class="btn o sm" onclick="nuevaAsesoria()">+ registrar asesoría</button>
     <div class="hint" style="margin-top:8px">Los compromisos con apartado aparecen dentro de ese apartado, junto a tus pendientes. Y esto es de donde vas a copiar la bitácora oficial.</div>
   </div>

   <div class="pv-prep">
     <div class="h">Preguntas para la asesoría</div>
     ${a.preguntas.length?a.preguntas.map((p,i)=>`
       <div style="border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:9px">
         <div style="display:flex;gap:8px;align-items:center;margin-bottom:7px">
           <span class="hint">${i+1}</span><span class="sp"></span>
           <button class="hint" style="color:var(--muted)" onclick="delPregunta(${i})">quitar</button></div>
         <input class="in" style="margin-bottom:7px" placeholder="La pregunta, redactada como pregunta"
           value="${esc(p.q)}" oninput="setPregunta(${i},'q',this.value)">
         <textarea class="in" style="min-height:52px" placeholder="El contexto, dos o tres renglones"
           oninput="setPregunta(${i},'c',this.value)">${esc(p.c)}</textarea>
       </div>`).join(''):'<div class="hint" style="margin-bottom:10px">Todavía no hay preguntas. Una asesoría con tres preguntas concretas rinde mucho más que llevar el documento y esperar comentarios.</div>'}
     <div style="display:flex;gap:8px;flex-wrap:wrap">
       <button class="btn o sm" onclick="addPregunta()">+ pregunta</button>
       <button class="btn g sm" onclick="traerAtorados()">traer mis atorados</button>
     </div>
     <div class="hint" style="margin-top:7px">Los atorados llegan en bruto: reescríbelos como pregunta antes de exportar. "Me atoré en X" no va; "necesito su orientación sobre X" sí.</div>
   </div>`;

  if(!total) prep+=`<div class="pv-vacio"><b>El documento va a salir sin fichas.</b> Captura material en algún apartado y vuelve aquí.</div>`;

  /* ---------- el documento ---------- */
  let doc=`<div class="pv-doc">`;
  const pie=(n)=>`<div class="pv-pie"><span>Avance de protocolo${a.alumno?' · '+esc(a.alumno):''}</span><span>${n}</span></div>`;
  let pag=1;

  doc+=`<div class="pv-hoja"><div class="pv-port">
    <div class="pv-esc">Universidad de Guadalajara<br>Centro Universitario de Arte, Arquitectura y Diseño<br>Proyecto 9 · Proyecto Arquitectónico Integral</div>
    <div class="pv-mid">
      <div class="pv-lb">Avance de protocolo de investigación</div>
      <div class="pv-h1">${esc(tActual())}</div>
      <div class="pv-rule"></div>
      <div class="pv-meta">${a.alumno?`<b>${esc(a.alumno)}</b><br>`:''}${esc(a.maestra)}<br>Ciclo 2026 B · ${hoy}</div>
    </div>
    <div class="pv-cub"><div class="h">Qué cubre este avance</div>
      ${aps.length?`Apartados ${aps.map(id=>`<b>${id} ${esc(RUTAMAP[id].nom)}</b>`).join(', ')}.<br>
      Material documental reunido y organizado por apartado, con las referencias completas. Los textos todavía no están redactados en continuo: se presentan como fichas de trabajo.`
      :'Sin apartados seleccionados.'}
    </div></div>${pie(pag++)}</div>`;

  if(a.dondeVoy.trim() || aps.length){
    doc+=`<div class="pv-hoja">`;
    if(a.dondeVoy.trim()){
      doc+=`<div class="pv-sec">Dónde voy</div>`;
      doc+=a.dondeVoy.split(/\n\s*\n/).map(p=>`<p class="pv-p">${esc(p.trim()).replace(/\n/g,'<br>')}</p>`).join('');
    }
    if(aps.length){
      doc+=`<div class="pv-sec" style="margin-top:${a.dondeVoy.trim()?'36px':'0'}">Material reunido</div>
      <table class="pv-idx">
        <tr><th>Apart.</th><th>Nombre</th><th>Extensión</th><th class="n">Fichas</th><th class="n">Fuentes</th></tr>
        ${aps.map(id=>{const e=ex(id), fs=fichasDeAvance(id);
          const fu=new Set(fs.map(fuenteKey).filter(Boolean)).size;
          return `<tr><td>${id}</td><td>${esc(RUTAMAP[id].nom)}</td>
            <td>${e.min===e.max?e.ideal+' cuartillas':e.min+' a '+e.max+' cuartillas'}</td>
            <td class="n">${fs.length}</td><td class="n">${fu}</td></tr>`;}).join('')}
        <tr><td></td><td colspan="2"><b>Total</b></td><td class="n"><b>${total}</b></td><td class="n"><b>${fuentes.size}</b></td></tr>
      </table>
      <p class="pv-p" style="font-size:9.5pt;color:var(--muted);margin-top:12px">Las extensiones señaladas son las indicadas en clase. Una ficha es un dato o una cita textual con su fuente; una misma fuente puede dar varias fichas.</p>`;
    }
    doc+=pie(pag++)+`</div>`;
  }

  let cap=0;
  aps.forEach(id=>{
    const r=RUTAMAP[id], e=ex(id), fs=fichasDeAvance(id);
    const fu=new Set(fs.map(fuenteKey).filter(Boolean)).size;
    doc+=`<div class="pv-hoja">`;
    if(r.cap!==cap){ cap=r.cap; doc+=`<div class="pv-sec">${cap} · ${CAPS[cap]}</div>`; }
    const rd=red(id), palEd=palabrasDe(rd.html);
    doc+=`<div class="pv-ap">${id} ${esc(r.nom)}</div>
      <div class="pv-apm">Extensión indicada: ${e.min===e.max?e.ideal+' cuartillas':e.min+' a '+e.max+' cuartillas'} · ${fs.length} ficha${fs.length===1?'':'s'} de ${fu} fuente${fu===1?'':'s'}${palEd?' · '+palEd+' palabras redactadas':''}</div>`;
    if(a.texto && palEd){
      const {notas}=notasDe(rd.html);
      const dd=document.createElement('div'); dd.innerHTML=rd.html;
      dd.querySelectorAll('sup[data-f]').forEach(x=>{x.removeAttribute('data-f');x.removeAttribute('data-p');x.removeAttribute('contenteditable');});
      doc+=`<div class="pv-texto">${dd.innerHTML}</div>
        ${notas.length?`<div class="pv-notas"><div class="nt">Notas</div>
          <ol>${notas.map(n=>`<li>${n.html}</li>`).join('')}</ol></div>`:''}`;
      if(fs.length) doc+=`<div class="pv-apm" style="margin:22px 0 14px">Material de respaldo</div>`;
    }
    fs.forEach((f,i)=>{
      const bor=f.clase==='redaccion';
      const nn=String(i+1).padStart(2,'0');
      const ref=chicago(f.fuente||{});
      const tieneRef=(f.fuente||{}).autor||(f.fuente||{}).titulo||(f.fuente||{}).refCruda;
      doc+=`<div class="pv-fi ${bor?'bor':''}">
        <div class="n">${id} — ${nn} · ${esc(etiquetaFicha(f))}</div>
        <div class="tx">${bor?esc(f.extracto):'“'+esc(f.extracto)+'”'}</div>
        ${(!bor&&tieneRef)?`<div class="rf">${ref}${f.pagina?', '+esc(f.pagina):''}</div>`:''}
        ${(bor&&(f.fuentes||[]).length)?`<div class="rf" style="margin-top:4px">
          <b style="font-weight:600">Fuentes citadas:</b> ${f.fuentes.map(fs=>chicago(fs)).join(' ')}</div>`:''}
        ${f.paraQue?`<div class="us">${bor?'':'Uso: '}${esc(f.paraQue)}</div>`
          :(bor?'<div class="us">Borrador propio · sujeto a revisión</div>':'')}
      </div>`;
    });
    if(!fs.length) doc+=`<p class="pv-p" style="color:var(--muted)">Sin material capturado todavía.</p>`;
    doc+=pie(pag++)+`</div>`;
  });

  /* bibliografía */
  const map={};
  aps.forEach(id=>fichasDeAvance(id).forEach(f=>{
    const k=fuenteKey(f); if(k) map[k]=f.fuente;
    (f.fuentes||[]).forEach(s=>{ const k2=fuenteKey({fuente:s}); if(k2) map[k2]=s; }); }));
  if(a.texto) aps.forEach(id=>notasDe(red(id).html).bib.forEach(s=>{
    const k3=fuenteKey({fuente:s}); if(k3) map[k3]=s; }));
  const refs=Object.values(map).sort((x,y)=>(x.autor||x.refCruda||'zzz').localeCompare(y.autor||y.refCruda||'zzz','es'));
  if(refs.length){
    doc+=`<div class="pv-hoja"><div class="pv-sec">Bibliografía</div>
      <p class="pv-p" style="font-size:9.5pt;color:var(--muted);margin-bottom:20px">Estilo Chicago, sistema notas-bibliografía. Ordenada alfabéticamente por apellido del autor. Se listan únicamente las fuentes de las que se tomó material en este avance.</p>
      ${refs.map(s=>`<div class="pv-bib">${chicago(s)}</div>`).join('')}
      ${pie(pag++)}</div>`;
  }

  /* seguimiento de la asesoría anterior */
  const prev=asePrevia();
  const prevComp=prev?(prev.compromisos||[]).filter(c=>c.txt.trim()):[];
  if(prev && (prevComp.length || (prev.retro||'').trim())){
    doc+=`<div class="pv-hoja"><div class="pv-sec">Seguimiento de la asesoría anterior</div>
      <p class="pv-p" style="font-size:9.5pt;color:var(--muted);margin-bottom:18px">Asesoría del ${esc(fechaLarga(prev.fecha))}.</p>`;
    if((prev.retro||'').trim()){
      doc+=`<div class="pv-ap" style="font-size:11.5pt;margin-bottom:10px">Lo que se me indicó</div>`;
      doc+=prev.retro.split(/\n\s*\n/).map(p=>`<p class="pv-p">${esc(p.trim()).replace(/\n/g,'<br>')}</p>`).join('');
    }
    if(prevComp.length){
      doc+=`<div class="pv-ap" style="font-size:11.5pt;margin:26px 0 12px">Cómo quedó</div>
        <table class="pv-idx"><tr><th>Estado</th><th>Compromiso</th><th>Apart.</th></tr>
        ${prevComp.map(c=>`<tr>
          <td style="color:${c.estado==='hecho'?'var(--accent)':(c.estado==='no'?'var(--warn)':'var(--muted)')}">${COMPLBL[c.estado]}</td>
          <td>${esc(c.txt)}</td><td>${c.apartado||'—'}</td></tr>`).join('')}
        </table>`;
    }
    doc+=pie(pag++)+`</div>`;
  }

  /* compromisos para la próxima */
  const act=aseActual();
  const actComp=act?(act.compromisos||[]).filter(c=>c.txt.trim()):[];
  if(actComp.length){
    doc+=`<div class="pv-hoja"><div class="pv-sec">Compromisos</div>
      <p class="pv-p" style="margin-bottom:20px">Lo que voy a tener listo para la siguiente revisión.</p>
      ${actComp.map((c,i)=>`<div class="pv-preg">
        <div class="q">${i+1} · ${esc(c.txt)}</div>
        ${c.apartado?`<div class="c">Apartado ${c.apartado} · ${esc((RUTAMAP[c.apartado]||{}).nom||'')}</div>`:''}
      </div>`).join('')}
      ${pie(pag++)}</div>`;
  }

  /* preguntas */
  const pregs=a.preguntas.filter(p=>p.q.trim());
  if(pregs.length){
    doc+=`<div class="pv-hoja"><div class="pv-sec">Preguntas para la asesoría</div>
      <p class="pv-p" style="margin-bottom:22px">Puntos en los que necesito su orientación antes de avanzar al siguiente apartado.</p>
      ${pregs.map((p,i)=>`<div class="pv-preg"><div class="q">${i+1} · ${esc(p.q)}</div>
        ${p.c.trim()?`<div class="c">${esc(p.c)}</div>`:''}</div>`).join('')}
      ${pie(pag++)}</div>`;
  }
  doc+=`</div>`;
  return prep+doc;
}

/* =========================================================
   ARRANQUE
   ========================================================= */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(M)closeModal(); else if(A)cerrarAtoro(); else if(TT)cerrarTitulo(); else if(F)cerrarFuente(); else if(CI)cerrarInsertar(); }
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&M){ const s=M.fuente;
    if((M.clase==='redaccion'||M.fija||(s.autor||s.titulo||s.liga||s.refCruda))&&M.extracto.trim()) guardarFicha(true); }
});
docLoad().then(()=>{ if(view==='docs') render(); });
render();
</script>
</body>
</html>
