<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#FFFFFF;--panel:#F3F5F7;--card:#FFFFFF;--text:#14181C;--muted:#6F777E;
  --line:#E0E5E9;--track:#E9EDF1;
  --accent:#2E5266;--accent2:#6E93A6;--soft:#EAF0F4;
  --warn:#B07A3C;--warnsoft:#F8F1E6;--warnline:#E7D6BC;
  --ok:#3E6B55;--oksoft:#EBF2EE;--okline:#CBDDD3;
  --ph:#B6BDC2;--sh:0 10px 30px rgba(20,24,28,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Alexandria',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  font-size:13px;line-height:1.55;font-weight:300;overflow:hidden}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D3D9DD;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.logo{font-size:12.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.tabs{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap}
.tab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:6px 12px;border-radius:6px;color:var(--muted)}
.tab.on{background:var(--accent);color:#fff;font-weight:500}
.main{flex:1;display:flex;min-height:0}

/* ---------- sidebar ---------- */
.side{width:250px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  padding:12px 11px;overflow-y:auto}
.buzon{background:var(--card);border:1px solid var(--accent);border-radius:7px;padding:8px 10px;
  display:flex;justify-content:space-between;align-items:center;font-size:11.5px;margin-bottom:14px;width:100%;text-align:left}
.buzon b{font-weight:600;color:var(--accent)}
.badge{background:var(--accent);color:#fff;border-radius:10px;font-size:10px;padding:1px 8px;font-weight:500}
.capt{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 7px 3px}
.row{padding:6px 6px 7px;border-radius:7px;margin-bottom:2px;width:100%;text-align:left;display:block}
.row:hover{background:rgba(255,255,255,.6)}
.row.on{background:var(--card);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.05)}
.rt{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.rn{font-size:10px;color:var(--muted);width:20px;flex:none;font-weight:500}
.rl{font-size:11.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:block;height:4px;background:#D6DFE5;border-radius:2px;margin:6px 0 0 27px;position:relative;overflow:hidden}
.rt{width:100%}
.mini i{display:block;height:100%;border-radius:2px;background:var(--accent2);min-width:0}
.mini u{position:absolute;top:0;width:1px;height:100%;background:#8FA0AA}

/* ---------- content ---------- */
.content{flex:1;overflow-y:auto;padding:18px 22px 60px;min-width:0}
.wide{max-width:900px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.mh .num{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mh h2{font-size:20px;font-weight:600;margin:3px 0 0;letter-spacing:-.01em;line-height:1.2}
.sello{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:3px;font-weight:600;vertical-align:2px;margin-left:7px}
.sello.clase{background:var(--text);color:#fff}
.sello.prop{background:transparent;color:var(--muted);border:1px dashed var(--line)}

.btn{background:var(--accent);color:#fff;font-size:12px;padding:8px 15px;border-radius:7px;font-weight:500;white-space:nowrap;display:inline-block}
.btn:hover{filter:brightness(1.12)}
.btn.o{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.g{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.sm{font-size:11px;padding:6px 11px}
.btn[disabled]{background:var(--line);color:#A5ADB3;cursor:default;filter:none;border:none}

.info{background:var(--panel);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;
  padding:11px 13px;margin-bottom:14px;font-size:12px;color:var(--muted)}
.info b{color:var(--text);font-weight:500}
.info .lb{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;display:block;margin:9px 0 3px}
.info .lb:first-child{margin-top:0}
.lbt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
  margin:13px 0 4px;padding:2px 0;border-radius:4px}
.lbt:first-child{margin-top:0}
.lbt:hover{opacity:.72}
.lbt .car{font-size:8px;display:inline-block;transition:transform .15s;color:var(--accent2);flex:none}
.lbt.closed .car{transform:rotate(-90deg)}
.lbt .pk{margin-left:auto;font-weight:200;text-transform:none;letter-spacing:0;font-size:11px;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56%;min-width:0}
.gtx{margin-bottom:2px}
.tip{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:11.5px;color:var(--text)}
.tip b{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}

.therm{border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:16px;background:var(--card)}
.tl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;gap:10px}
.tl b{color:var(--text);font-weight:500}
.track{height:8px;background:#DFE6EB;border-radius:4px;overflow:hidden;margin-bottom:11px;position:relative}
.track i{display:block;height:100%;border-radius:4px;background:var(--accent2)}
.track.over i{background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 4px,transparent 4px,transparent 7px)}
.track u{position:absolute;top:0;width:1px;height:100%;background:#8FA0AA}
.state{display:inline-block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:3px 9px;font-weight:600}
.state.sobra{border-color:var(--warn);color:var(--warn);background:var(--warnsoft)}
.redac{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:2px}
.redac input{width:62px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:16px;text-align:right;background:var(--card)}

.fh{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.fh .h{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pill{border:1px solid var(--line);border-radius:14px;padding:4px 11px;font-size:11px;color:var(--muted);background:var(--card)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.search{border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:16px;background:var(--card);width:190px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.fc{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--card);position:relative}
.fc .kind{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;font-weight:600;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.fc .kind .pend{color:var(--warn);background:var(--warnsoft);border-radius:3px;padding:1px 5px;letter-spacing:.06em}
/* verificación: si no la confirmaste tú, la ficha se ve distinta de un vistazo */
.fc.nover{border-left:3px solid var(--warn)}
.vok{color:var(--ok);background:var(--oksoft);border:1px solid var(--okline);border-radius:3px;
  padding:1px 6px;letter-spacing:.06em;font-size:9px;font-weight:600}
.vno{color:var(--warn);background:var(--warnsoft);border:1px solid var(--warnline);border-radius:3px;
  padding:1px 6px;letter-spacing:.06em;font-size:9px;font-weight:600;cursor:pointer}
.vno:hover{background:#F2E6D2}
.tbl .vok,.tbl .vno{padding:1px 5px}
/* clave BibTeX: el puente con LaTeX */
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}
.bk{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;
  background:var(--soft);color:var(--accent);border:0;border-radius:4px;padding:1px 6px;
  margin-left:7px;cursor:pointer;vertical-align:1px}
.bk:hover{background:#DCE6EC}
.bk.sin{background:var(--warnsoft);color:var(--warn);cursor:default}
.bk2{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;color:var(--accent2);margin-top:2px}
.fc .ttl{font-size:12.5px;font-weight:500;line-height:1.35;margin-bottom:6px}
/* el extracto manda: es lo que vas a leer y lo que vas a usar */
.fc .q{font-size:13.5px;color:var(--text);line-height:1.65;font-weight:300;
  border-left:2px solid var(--accent2);padding-left:11px;white-space:pre-wrap;margin-bottom:9px}
.fc .parq{font-size:11.5px;color:var(--accent);line-height:1.5;margin:0 0 9px 13px;font-weight:400}
/* recorte con puntos suspensivos para los textos largos */
.fmt{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:9px}
.fmt .fh2{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.fmt .fh2 b{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.fmt .fh2 .hh{font-size:10.5px;color:var(--muted);font-weight:300}
.fmt .lnk{font-size:10.5px;color:var(--muted)}
.fmt .lnk:hover{color:var(--accent);text-decoration:underline}
.fmt .lnk.cp{color:var(--accent);font-weight:500}
.fmt .prev{background:var(--panel);border-radius:6px;padding:8px 10px;font-size:11.5px;
  line-height:1.55;color:var(--text);font-weight:300;margin-bottom:7px}
.fmt .prev i{font-style:italic}
.cita{display:flex;gap:9px;align-items:flex-start;background:var(--panel);border-radius:7px;
  padding:8px 10px;margin-bottom:6px}
.cita .t{flex:1;font-size:11.5px;line-height:1.45;color:var(--text);font-weight:300;min-width:0}
.cita button{flex:none;color:var(--muted);font-size:12px;padding:0 3px}
.cita button:hover{color:var(--warn)}
.fc .citas{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.fc .citas .cl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px}
.fc .citas div.r1{font-size:10.5px;color:var(--muted);line-height:1.45;margin-bottom:4px;font-weight:300}
.fc .q.clamp{display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden;cursor:zoom-in}
.fc .q.clamp.open{display:block;cursor:zoom-out}
.fc .vermas{font-size:10.5px;color:var(--accent);margin:-4px 0 9px 13px;font-weight:500}
.fc .vermas:hover{text-decoration:underline}
/* las fichas de redacción se ven distinto: son tuyas, no de nadie más */
.fc.bor{background:#FBFAF7;border-color:#E4DED2}
.fc.bor .q{border-left-color:var(--warn);font-style:normal;color:var(--text)}
.fc.bor .q.clamp{-webkit-line-clamp:7}
.cbor{background:var(--warnsoft);color:var(--warn);border-radius:3px;padding:1px 6px;letter-spacing:.06em}
/* la fuente queda de pie de página, no de encabezado */
.fc .src{display:flex;gap:9px;align-items:flex-start;padding-top:9px;border-top:1px solid var(--line)}
.fc .src .fcref{display:block;flex:1;font-size:11px;color:var(--muted);line-height:1.45;min-width:0;font-weight:300}
.fc .nfu{flex:none;background:var(--soft);color:var(--accent);border-radius:10px;
  padding:2px 8px;font-size:9.5px;font-weight:700;white-space:nowrap}
.fc .nfu:hover{background:var(--accent);color:#fff}
.avisofil{background:var(--soft);color:var(--accent);border-radius:8px;padding:9px 13px;
  font-size:12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.avisofil b{font-weight:600}
.avisofil button{margin-left:auto;color:var(--accent);font-size:11.5px;text-decoration:underline}
.fc .ft{display:flex;gap:8px;margin-top:9px;font-size:10.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.fc .ft button{font-size:10.5px;color:var(--accent)}
.fc .ft button:hover{text-decoration:underline}
.empty{border:1px dashed var(--line);border-radius:9px;padding:26px 18px;text-align:center;color:var(--muted);font-size:12.5px}

/* ---------- atorados ---------- */
.at{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px;background:var(--card);display:flex;gap:13px;align-items:flex-start}
.at .t{font-size:13px;font-weight:500;margin-bottom:3px}
.at .m{font-size:11.5px;color:var(--muted);line-height:1.5}
.at code{background:var(--panel);border-radius:3px;padding:1px 5px;font-family:inherit;font-size:11px}
.stt{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:4px;font-weight:600;white-space:nowrap;flex:none}
.stt.p{background:var(--warnsoft);color:var(--warn)}
.stt.c{background:var(--soft);color:var(--accent)}
.stt.r{background:var(--panel);color:var(--muted)}
.apb{display:inline-block;font-size:10px;background:var(--soft);color:var(--accent);border-radius:4px;padding:1px 7px;font-weight:500;margin-right:6px}

/* ---------- biblio ---------- */
.bstat{display:flex;gap:24px;flex-wrap:wrap;background:var(--panel);border-radius:9px;padding:13px 17px;margin-bottom:18px}
.bstat div{font-size:11.5px;color:var(--muted)}
.bstat b{display:block;font-size:21px;font-weight:600;color:var(--text);line-height:1.2}
.bstat .w b{color:var(--warn)}
.ref{padding:11px 0 12px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.ref .txt{flex:1;font-size:12.5px;line-height:1.6}
.ref .rule{font-size:10.5px;color:var(--muted);margin-top:4px}
.ref .used{font-size:10px;color:var(--muted);white-space:nowrap;flex:none;padding-top:3px}
.ref.inc{background:var(--warnsoft);border-radius:7px;padding:11px 10px;border-bottom:none;margin-bottom:6px}
.ref.inc .rule{color:var(--warn);font-weight:500}

/* ---------- ajustes ---------- */
.set{border-bottom:1px solid var(--line);padding:14px 0;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.set .k{flex:1;min-width:250px}
.set .k b{font-size:13px;font-weight:500;display:block;margin-bottom:2px}
.set .k span{font-size:11.5px;color:var(--muted);line-height:1.5;display:block}
.set .c{flex:none;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.inp{border:1px solid var(--line);border-radius:6px;padding:8px 11px;font-size:16px;background:var(--card);width:90px;text-align:right}
.inp.wide{width:100%;text-align:left;font-size:16px}
.sel2{border:1px solid var(--line);border-radius:6px;padding:8px 11px;font-size:16px;background:var(--card)}
.secth{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 4px}
.secth:first-child{margin-top:0}
table.ext{border-collapse:collapse;width:100%;font-size:12px;margin-top:10px}
table.ext th,table.ext td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.ext th{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.ext input{width:58px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-size:16px;text-align:right;background:var(--card)}
.code{width:100%;min-height:80px;border:1px solid var(--line);border-radius:7px;padding:10px;font-size:12px;
  font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--panel);word-break:break-all;resize:vertical}
.msg{font-size:11.5px;padding:8px 11px;border-radius:6px;margin-top:9px;display:none}
.msg.ok{background:var(--oksoft);color:var(--ok);display:block}
.msg.err{background:var(--warnsoft);color:var(--warn);display:block}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,24,28,.32);display:flex;align-items:flex-start;
  justify-content:center;padding:24px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:560px;box-shadow:var(--sh);
  border:1px solid var(--line);overflow:hidden;margin:auto}
.mtop{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mtop b{font-size:15px;font-weight:600}
.mtop .apto{font-size:11px;color:var(--accent);background:var(--soft);border-radius:5px;padding:3px 9px;font-weight:500;margin-left:auto}
.mtop .x{font-size:18px;color:var(--muted);padding:0 4px;line-height:1}
.mbody{padding:16px 18px;max-height:calc(100vh - 190px);overflow-y:auto}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);background:var(--panel);display:flex;gap:9px;align-items:center;flex-wrap:wrap}

.paste{border:1.5px dashed var(--accent2);border-radius:9px;background:var(--soft);padding:11px 13px;margin-bottom:17px}
.paste .t{font-size:11.5px;color:var(--accent);font-weight:500;margin-bottom:7px}
.paste .h{font-size:10.5px;color:var(--muted);margin-top:6px}

.gl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;
  margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.gl .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-size:10.5px}
.grp{margin-bottom:17px}
.fld{margin-bottom:12px}
label{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:5px;flex-wrap:wrap}
.req{background:var(--accent);color:#fff;font-size:8.5px;padding:1.5px 5px;border-radius:3px;letter-spacing:.06em}
.op{background:var(--panel);color:var(--muted);font-size:8.5px;padding:1.5px 5px;border-radius:3px;letter-spacing:.06em}
.auto{background:var(--oksoft);color:var(--ok);font-size:8.5px;padding:1.5px 5px;border-radius:3px;letter-spacing:.06em}
.hintl{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-size:10.5px;color:var(--muted)}
.in{border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:16px;background:var(--card);
  width:100%;line-height:1.4;display:block}
.in::placeholder{color:var(--ph)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,82,102,.09)}
.in.tall{min-height:92px;resize:vertical}
.in.auto{min-height:42px;resize:none;overflow:hidden}
.in.filled{background:var(--oksoft);border-color:var(--okline)}
.in.pend{background:var(--warnsoft);border-color:var(--warnline)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px;color:var(--muted);background:var(--card);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.chip.autoon{background:var(--oksoft);border-color:var(--okline);color:var(--ok);font-weight:500}
.two{display:flex;gap:10px;flex-wrap:wrap}.two>div{flex:1;min-width:120px}
.banner{border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:15px;display:flex;gap:9px;align-items:flex-start}
.banner.ok{background:var(--oksoft);color:var(--ok)}
.banner.wa{background:var(--warnsoft);color:var(--warn)}
.banner.lo{background:var(--soft);color:var(--accent)}
.banner b{font-weight:600}
.fold{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--accent);
  font-weight:500;display:flex;align-items:center;gap:8px;margin-top:4px;width:100%;text-align:left}
.fold .h{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:400}
.counter{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.counter b{color:var(--accent);font-weight:600}
.bar{height:4px;background:var(--track);border-radius:3px;flex:1;overflow:hidden;max-width:130px}
.bar i{display:block;height:100%;background:var(--accent2)}
.lock{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  margin-bottom:15px;display:flex;gap:10px;align-items:flex-start}
.lock .t{font-size:12.5px;font-weight:500;line-height:1.4}
.lock .s{font-size:11px;color:var(--muted);margin-top:2px}
.sp{flex:1}
.hint{font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;
  padding:10px 18px;border-radius:8px;font-size:12.5px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* ---------- título en la barra ---------- */
.tit{flex:1;min-width:0;text-align:left;display:flex;align-items:baseline;gap:9px;
  padding:5px 11px;border-radius:7px;border:1px solid transparent;max-width:640px}
.tit:hover{background:var(--card);border-color:var(--line)}
.tit .tl{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;flex:none}
.tit .tt{font-size:12.5px;font-weight:400;color:var(--text);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;flex:1}
.tit .tv{font-size:9.5px;color:var(--accent);font-weight:600;flex:none}
.tit .vacio{color:var(--muted);font-style:italic}

/* ---------- panel del título ---------- */
.tsec{margin-bottom:20px}
.tsec>.h{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:8px}
.tsec>.h .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:300;font-size:10.5px}
.parte{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.parte .pn{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px;
  display:flex;align-items:center;gap:8px}
.parte .pn .dnd{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:300;font-size:10.5px}
.esc{display:flex;gap:4px;margin-top:9px}
.esc button{flex:1;border:1px solid var(--line);border-radius:5px;padding:5px 4px;font-size:9.5px;
  color:var(--muted);line-height:1.25;text-align:center;background:var(--card)}
.esc button.lleno{background:var(--soft);border-color:var(--accent2);color:var(--accent);font-weight:500}
.esc button.hoy{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.esc button.meta{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.escpie{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px}
.ver{border-left:2px solid var(--line);padding:0 0 14px 14px;position:relative;margin-left:5px}
.ver:last-child{padding-bottom:0}
.ver::before{content:'';position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;
  background:var(--line)}
.ver.act::before{background:var(--accent)}
.ver .vf{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ver .vt{font-size:12.5px;line-height:1.5;margin:3px 0 3px}
.ver.act .vt{font-weight:500}
.ver .vm{font-size:11px;color:var(--muted);font-style:italic}
.ver .vb{font-size:10.5px;color:var(--accent);margin-top:4px}
.cnc{display:flex;gap:6px;flex-wrap:wrap}
.cnc button{border:1px solid var(--line);border-radius:14px;padding:5px 11px;font-size:11.5px;color:var(--muted);background:var(--card)}
.cnc button.def{background:var(--oksoft);border-color:var(--okline);color:var(--ok)}
.cnc button.desc{text-decoration:line-through;opacity:.55}
.avistit{background:var(--warnsoft);color:var(--warn);border-radius:4px;padding:1px 6px;
  font-size:9.5px;letter-spacing:.05em;font-weight:600}

/* =========================================================
   TAMAÑO DE LOS CAMPOS
   En compu van a 13 px, como el resto del cuerpo.
   Solo en pantallas táctiles suben a 16 px, que es el mínimo
   que evita el zoom automático de Safari en iPhone.
   ========================================================= */
.in,.inp,.sel2,.search,.pgin,.redac input,.code,
.dform input,.dform select,table.ext input{font-size:13px}
.in.tall{font-size:13px}
@media (pointer: coarse){
  .in,.inp,.sel2,.search,.pgin,.redac input,.code,
  .dform input,.dform select,table.ext input,.in.tall{font-size:16px}
}

/* ---------- apartado en dos columnas ---------- */
.apgrid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;margin-bottom:16px;align-items:stretch}
.apcol{display:flex;flex-direction:column;min-width:0}
.apcol .info{margin-bottom:14px}
.apcol .therm{margin-bottom:0;flex:1}
.pend{border:1px solid var(--line);border-radius:9px;background:var(--card);
  display:flex;flex-direction:column;overflow:hidden;min-height:0}
.pend .ph{padding:11px 13px 10px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.pend .ph b{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pend .ph .n{margin-left:auto;font-size:11px;color:var(--accent);font-weight:600}
.pend .pin{padding:10px 13px;border-bottom:1px solid var(--line);background:var(--panel)}
.pend .plist{flex:1;overflow-y:auto;padding:8px 9px 10px;min-height:70px;max-height:340px}
.prow{display:flex;gap:8px;align-items:flex-start;padding:6px 5px;border-radius:6px}
.prow:hover{background:var(--panel)}
.prow .ck{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--accent2);flex:none;margin-top:2px}
.prow .ck:hover{background:var(--soft)}
.prow.done .ck{background:var(--accent);border-color:var(--accent);
  background-image:linear-gradient(45deg,transparent 45%,#fff 45%,#fff 55%,transparent 55%)}
.prow .tx{flex:1;font-size:12.5px;line-height:1.45;min-width:0;word-break:break-word}
.prow.done .tx,.prow.na .tx{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.prow.na .ck{border-style:dashed;border-color:var(--line)}
.pacts{display:flex;gap:7px;opacity:0;transition:opacity .15s;flex:none;padding-top:2px}
.prow:hover .pacts{opacity:1}
.pacts button{font-size:10px;color:var(--muted);white-space:nowrap}
.pacts button:hover{color:var(--accent);text-decoration:underline}
.pacts button.at:hover{color:var(--warn)}
.prow.comp{background:var(--soft)}
.prow .ck.comp{border-color:var(--accent);background:var(--accent);border-radius:3px}
.prow .deq{display:block;font-size:10px;color:var(--accent);margin-top:2px;font-weight:500}
.pvacio{font-size:11.5px;color:var(--muted);padding:14px 6px;line-height:1.5}
.pmas{padding:8px 13px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);text-align:left;width:100%}
.pmas:hover{color:var(--accent)}
.pnum{background:var(--accent);color:#fff;border-radius:9px;font-size:9px;padding:0 5px;
  font-weight:600;margin-left:auto;flex:none;line-height:1.6}
@media(max-width:1020px){.apgrid{grid-template-columns:minmax(0,1fr)}.apcol .therm{flex:none}}


/* ---------- editor de redacción ---------- */
.edwrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.edbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);
  border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.edbar .med{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.edbar .med b{color:var(--text);font-weight:600}
.edrea{padding:26px 34px;min-height:380px;font-size:14.5px;line-height:1.95;font-weight:300;
  outline:none;color:#1B2226;white-space:pre-wrap}
.edrea:empty::before{content:attr(data-ph);color:var(--ph);pointer-events:none}
.edrea div{margin-bottom:.85em}
.edrea sup{display:inline-block;background:var(--soft);color:var(--accent);font-weight:700;
  font-size:9.5px;line-height:1;padding:2px 4px;border-radius:3px;margin:0 1px;
  vertical-align:super;user-select:none;cursor:default;min-width:14px;text-align:center}
.edrea sup:hover{background:var(--accent);color:#fff}
.ednotas{border-top:1px solid var(--line);padding:18px 34px 26px;background:#FCFDFD}
.edsec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:10px;display:flex;gap:9px;align-items:baseline}
.edsec .r{text-transform:none;letter-spacing:0;font-weight:300;font-size:10.5px}
ol.notas{margin:0;padding-left:22px;font-size:11.5px;line-height:1.7;color:var(--text);font-weight:300}
ol.notas li{margin-bottom:6px;padding-left:3px}
ol.notas i,.bibl i{font-style:italic}
.bibl{font-size:11.5px;line-height:1.65;margin-bottom:7px;padding-left:22px;text-indent:-22px;
  color:var(--text);font-weight:300}

function chicago(s){
  /* si pegaste una referencia ya hecha y pediste usarla tal cual, se respeta */
  if(s.usarCruda && s.refCruda) return esc(s.refCruda).replace(/[*_]{1,2}([^*_]{3,})[*_]{1,2}/g,'<i>$1</i>');
  const A=esc(s.autor||''), T=esc(s.titulo||''), Y=esc(s.anio||''), L=esc(s.liga||'');
  const p=(x)=>x?x:'';
  /* si el autor ya termina en punto (una inicial), no se le agrega otro */
  const pt = A.slice(-1)==='.' ? ' ' : '. ';
  switch(s.tipo){
    case 'libro': return `${p(A)}${A?pt:''}<i>${T}</i>. ${s.ciudad?esc(s.ciudad)+': ':''}${esc(s.editorial||'')}${(s.ciudad||s.editorial)&&Y?', ':''}${Y}.`;
    case 'capitulo': {
      /* Apellido, Nombre. "Capítulo." En *Libro*, editado por X, 55–68. Ciudad: Editorial, año. */
      const ed = s.editor? ', editado por '+esc(nombreDerecho(s.editor)) : '';
      const pp = s.paginas? ', '+esc(s.paginas) : '';
      const pie = s.ciudad? esc(s.ciudad)+(s.editorial?': '+esc(s.editorial):'') : esc(s.editorial||'');
      return `${p(A)}${A?pt:''}"${T}." En <i>${esc(s.libro||'')}</i>${ed}${pp}. ${pie}${pie&&Y?', ':''}${Y}.`;
    }
    case 'articulo': return `${p(A)}${A?pt:''}"${T}." <i>${esc(s.revista||'')}</i>${s.volumen?' '+esc(s.volumen):''}${s.numero?', no. '+esc(s.numero):''}${Y?' ('+Y+')':''}${s.paginas?': '+esc(s.paginas):''}.`;
    case 'tesis': return `${p(A)}${A?pt:''}"${T}." ${esc(s.grado||'Tesis')}, ${esc(s.universidad||'')}${Y?', '+Y:''}.`;
    case 'ley': return `<i>${T}</i>. ${s.ciudad?esc(s.ciudad)+': ':''}${A}${Y?', '+Y:''}.`;
    case 'sitio': return `${p(A)}${A?pt:''}"${T}." <i>${esc(s.sitio||'')}</i>. ${esc(s.fecha||'')}${L?'. '+L:''}.`;
    case 'prensa': return `${p(A)}${A?pt:''}"${T}." <i>${esc(s.medio||'')}</i>, ${esc(s.fecha||'')}${L?'. '+L:''}.`;
    case 'video': return `${p(A)}${A?pt:''}"${T}." Video de YouTube${s.duracion?', '+esc(s.duracion):''}. ${s.fecha?'Publicado el '+esc(s.fecha):''}${L?'. '+L:''}.`;
    default: return `${p(A)}${A?pt:''}${T}${Y?'. '+Y:''}${L?'. '+L:''}.`;
  }
}
/* ---- nombres: en bibliografía va invertido, en nota va al derecho ---- */
function nombreDerecho(autor){
  if(!autor) return '';
  const partes = autor.split(/\s*;\s*/).filter(Boolean).map(p=>{
    const c=p.split(/\s*,\s*/);
    return c.length>1 ? (c.slice(1).join(', ')+' '+c[0]).trim() : p.trim();
  });
  if(partes.length===1) return partes[0];
  if(partes.length===2) return partes[0]+' y '+partes[1];
  return partes.slice(0,-1).join(', ')+' y '+partes[partes.length-1];
}
function apellidoDe(autor){
  if(!autor) return '';
  const uno=autor.split(/\s*;\s*/)[0]||'';
  const c=uno.split(/\s*,\s*/);
  return (c.length>1? c[0] : uno.split(/\s+/).slice(-1)[0]||uno).trim();
}
function tituloCorto(t){
  if(!t) return '';
  const lim=t.replace(/[“”"«»]/g,'').split(/[:.;]/)[0].trim();
  const w=lim.split(/\s+/);
  return w.slice(0,4).join(' ');
}
/* CLAVE BIBTEX — el puente con el documento de LaTeX. apellidoaño, sin acentos */
function bibkeyDe(s){
  const ap=apellidoDe(s.autor||'').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
  const y=(String(s.anio||s.fecha||'').match(/\d{4}/)||[''])[0];
  return ap+y;
}
function bibkeyRepetida(clave, exceptoKey){
  if(!clave) return 0;
  const vistos={};
  S.fichas.forEach(f=>{ const k=fuenteKey(f); if(!k||k===exceptoKey) return;
    if((f.fuente||{}).bibkey===clave) vistos[k]=1; });
  return Object.keys(vistos).length;
}
function md2i(t){ return esc(t).replace(/[*_]{1,2}([^*_]{2,})[*_]{1,2}/g,'<i>$1</i>'); }

/* NOTA AL PIE COMPLETA — nombre al derecho, comas, publicación entre paréntesis,
   y solo la página de la cita. */
function chicagoNota(s, pag){
  if(s.notaC && s.notaC.trim()) return md2i(s.notaC.trim()) + (pag?', '+esc(pag):'') + '.';
  const A=esc(nombreDerecho(s.autor||'')), T=esc(s.titulo||''), Y=esc(s.anio||'');
  const L=esc(s.liga||''), P=pag?', '+esc(pag):'';
  const pub=(...x)=>{ const v=x.filter(Boolean).join(', '); return v?' ('+v+')':''; };
  switch(s.tipo){
    case 'libro':
      return `${A?A+', ':''}<i>${T}</i>${pub([esc(s.ciudad||''),esc(s.editorial||'')].filter(Boolean).join(': '),Y)}${P}.`;
    case 'capitulo':
      return `${A?A+', ':''}"${T}," en <i>${esc(s.libro||'')}</i>${s.editor?', ed. '+esc(nombreDerecho(s.editor)):''}${pub([esc(s.ciudad||''),esc(s.editorial||'')].filter(Boolean).join(': '),Y)}${P}.`;
    case 'articulo':
      return `${A?A+', ':''}"${T}," <i>${esc(s.revista||'')}</i>${s.volumen?' '+esc(s.volumen):''}${s.numero?', no. '+esc(s.numero):''}${Y?' ('+Y+')':''}${P?':'+P.slice(1):''}.`;
    case 'tesis':
      return `${A?A+', ':''}"${T}"${pub((esc(s.grado||'tesis')).toLowerCase(),esc(s.universidad||''),Y)}${P}.`;
    case 'ley':
      return `<i>${T}</i>${pub(esc(s.ciudad||''),esc(s.autor||''),Y)}${P}.`;
    case 'sitio':
      return `${A?A+', ':''}"${T}," <i>${esc(s.sitio||'')}</i>${s.fecha?', '+esc(s.fecha):''}${L?', '+L:''}${P}.`;
    case 'prensa':
      return `${A?A+', ':''}"${T}," <i>${esc(s.medio||'')}</i>${s.fecha?', '+esc(s.fecha):''}${L?', '+L:''}${P}.`;
    case 'video':
      return `${A?A+', ':''}"${T}," video de YouTube${s.duracion?', '+esc(s.duracion):''}${s.fecha?', publicado el '+esc(s.fecha):''}${L?', '+L:''}${P}.`;
    default:
      return `${A?A+', ':''}${T}${Y?', '+Y:''}${L?', '+L:''}${P}.`;
  }
}
/* NOTA ABREVIADA — de la segunda vez en adelante */
function chicagoNotaCorta(s, pag){
  if(s.notaA && s.notaA.trim()) return md2i(s.notaA.trim()) + (pag?', '+esc(pag):'') + '.';
  const ap=esc(apellidoDe(s.autor||'')) || esc((s.titulo||'').split(/\s+/).slice(0,3).join(' '));
  const tc=esc(tituloCorto(s.titulo||''));
  const cursiva = s.tipo==='libro' || s.tipo==='ley';
  const t = tc ? (cursiva?`<i>${tc}</i>`:`"${tc}"`) : '';
  return [ap, t].filter(Boolean).join(', ') + (pag?', '+esc(pag):'') + '.';
}
/* versiones en texto plano, para copiar */
function planoDe(html){ const d=document.createElement('div'); d.innerHTML=html; return d.textContent.replace(/\s+/g,' ').trim(); }

function faltan(s){
  if(s.usarCruda && s.refCruda) return [];   /* referencia pegada completa */
  const f=[];
  if(!s.autor) f.push('autor'); if(!s.titulo) f.push('título');
  if(!s.anio && !s.fecha) f.push('año');
  return f;
}

/* ---- campo de clave BibTeX, igual en la ficha (M) y en el editor de fuente (F) ---- */
function bibkeyFld(s, ctx){
  const v=esc(s.bibkey||'');
  const sug=bibkeyDe(s);
  const rep=bibkeyRepetida(s.bibkey||'', ctx==='F'?(F&&F.key):fuenteKey({fuente:s}));
  const oninput = ctx==='M'
    ? `M.fuente.bibkey=this.value.trim().replace(/\\s+/g,'');avisoBibkey(this)`
    : `setF('bibkey',this.value.trim().replace(/\\s+/g,''));avisoBibkey(this)`;
  const poner = ctx==='M' ? `M.fuente.bibkey=bibkeyDe(M.fuente);drawModal()` : `setF('bibkey',bibkeyDe(F.s));drawFuente()`;
  return `<div class="fld" style="margin-bottom:0"><label>Clave BibTeX
      <span class="hintl">el puente con LaTeX — así la citas en el .tex</span></label>
    <div style="display:flex;gap:7px;align-items:flex-start">
      <input class="in mono" value="${v}" placeholder="${esc(sug||'hamchande1996')}" oninput="${oninput}">
      ${sug&&sug!==(s.bibkey||'')?`<button class="btn o sm" style="flex:none" onclick="${poner}">usar ${esc(sug)}</button>`:''}
    </div>
    <div class="hint bkav" style="margin-top:5px">${rep?`<span style="color:var(--warn)">⚠ Otra fuente ya usa esa clave. En LaTeX no pueden repetirse — agrégale una letra (${esc((s.bibkey||'')+'b')}).</span>`:'Minúsculas, sin acentos ni espacios: apellido + año.'}</div>
  </div>`;
}
function avisoBibkey(el){
  const av=el.closest('.fld').querySelector('.bkav'); if(!av) return;
  const v=el.value.trim();
  const rep=bibkeyRepetida(v, F?F.key:(M?fuenteKey({fuente:M.fuente}):null));
  av.innerHTML = rep? `<span style="color:var(--warn)">⚠ Otra fuente ya usa esa clave. En LaTeX no pueden repetirse — agrégale una letra (${esc(v+'b')}).</span>`
    : 'Minúsculas, sin acentos ni espacios: apellido + año.';
}
function fmtRows(s, pag, ctx){
  /* ctx: 'M' (ficha abierta) o 'F' (editor de fuente) */
  const set = ctx==='M' ? 'setFmtM' : 'setFmtF';
  const fila=(k, lbl, hint, valor, generado)=>{
    const propio = !!(valor && valor.trim());
    return `<div class="fmt">
      <div class="fh2"><b>${lbl}</b>
        <span class="hh">${hint}</span>
        <span class="sp"></span>
        ${propio?`<button class="lnk" onclick="${set}('${k}','')">volver a la automática</button>`:''}
        <button class="lnk cp" onclick="copiarFmt(this)">copiar</button></div>
      <div class="prev" data-plano="1">${generado}</div>
      <textarea class="in auto" placeholder="Escribe aquí solo si quieres corregirla a mano. Las cursivas van entre *asteriscos*."
        oninput="${set}('${k}',this.value);autoAlto(this)">${esc(valor||'')}</textarea>
    </div>`;
  };
  return `<div class="grp"><div class="gl">Formatos de cita <span class="r">— Chicago notas-bibliografía</span></div>
    ${fila('refCruda','Entrada de bibliografía','apellido invertido · puntos · va al final del documento',
       (s.usarCruda?s.refCruda:''), chicago(s))}
    ${fila('notaC','Nota al pie completa','nombre al derecho · comas · la primera vez que citas',
       s.notaC, chicagoNota(s, pag))}
    ${fila('notaA','Nota al pie abreviada','de la segunda vez en adelante',
       s.notaA, chicagoNotaCorta(s, pag))}
    <div class="hint">La página sale del campo <b>Página</b> de la ficha${pag?' — ahora dice <b>'+esc(pag)+'</b>':', que está vacío'}.</div>
  </div>`;
}
function setFmtM(k,v){
  if(k==='refCruda'){ M.fuente.refCruda=v; M.fuente.usarCruda=!!(v&&v.trim()); }
  else M.fuente[k]=v;
  const p=document.querySelectorAll('.fmt');
  /* repintar solo las previas, sin redibujar todo para no perder el cursor */
  actualizarPrevias();
}
function setFmtF(k,v){
  if(k==='refCruda'){ F.s.refCruda=v; F.s.usarCruda=!!(v&&v.trim()); }
  else F.s[k]=v;
  actualizarPrevias();
}
function actualizarPrevias(){
  const s = M? M.fuente : (F? F.s : null); if(!s) return;
  const pag = M? (M.pagina||'') : '';
  const prev=document.querySelectorAll('.fmt .prev');
  if(prev[0]) prev[0].innerHTML=chicago(s);
  if(prev[1]) prev[1].innerHTML=chicagoNota(s,pag);
  if(prev[2]) prev[2].innerHTML=chicagoNotaCorta(s,pag);
}
function copiarFmt(btn){
  const caja=btn.closest('.fmt').querySelector('.prev');
  copiar(planoDe(caja.innerHTML));
  toast('Copiado');
}
/* propagar los formatos a las demás fichas de la misma fuente */
function propagarFormatos(f){
  const k=fuenteKey(f); if(!k) return;
  S.fichas.forEach(x=>{ if(x!==f && fuenteKey(x)===k){
    x.fuente.refCruda=f.fuente.refCruda; x.fuente.usarCruda=f.fuente.usarCruda;
    x.fuente.notaC=f.fuente.notaC; x.fuente.notaA=f.fuente.notaA;
    x.fuente.bibkey=f.fuente.bibkey; } });
  actualizarCitas(k, f.fuente);
}

/* =========================================================
   RENDER
   ========================================================= */
const VIEWS=[['apartados','Apartados'],['fichas','Fichas'],['docs','Documentos'],['atorados','Atorados'],['biblio','Bibliografía'],['avance','Avance'],['ajustes','Ajustes']];
function render(){
  pintarTitulo();
  document.getElementById('tabs').innerHTML = VIEWS.map(([v,l])=>
    `<button class="tab ${view===v?'on':''}" onclick="go('${v}')">${l}</button>`).join('');
  const side=document.getElementById('side');
  side.style.display = view==='apartados'?'':'none';
  if(view==='apartados') renderSide();
  const c=document.getElementById('content');
  if(view==='apartados') c.innerHTML=viewApartado();
  else if(view==='fichas') c.innerHTML=viewFichas();
  else if(view==='docs') c.innerHTML=viewDocs();
  else if(view==='atorados') c.innerHTML=viewAtorados();
  else if(view==='biblio') c.innerHTML=viewBiblio();
  else if(view==='avance') c.innerHTML=viewAvance();
  else c.innerHTML=viewAjustes();
  if(view==='docs') montarLector();
  if(view==='apartados' && modoAp==='texto' && sel) montarEditor(sel);
}
function go(v){ view=v; render(); }

function renderSide(){
  const sinCl=S.fichas.filter(f=>!f.apartado).length;
  let h=`<button class="buzon" onclick="sel='';render()"><span><b>Buzón</b> · sin clasificar</span><span class="badge">${sinCl}</span></button>`;
  let cap=0;
  RUTA.forEach(a=>{
    if(a.cap!==cap){ cap=a.cap; h+=`<div class="capt">${cap} · ${CAPS[cap]}</div>`; }
    const m=metrica(a.id);
    const markPos = m.meta? Math.min(m.mMin/(m.meta*1.35)*100,98) : 70;
    h+=`<button class="row ${sel===a.id?'on':''}" onclick="sel='${a.id}';render()">
      <span class="rt"><span class="dot" style="background:${dotColor(m.est)}"></span>
      <span class="rn">${a.id}</span><span class="rl">${esc(a.nom)}</span>
      ${pendAbiertos(a.id)?`<span class="pnum">${pendAbiertos(a.id)}</span>`:''}</span>
      <span class="mini"><i style="width:${Math.min(m.pct/1.35*100,100)}%;${m.est==='de-sobra'?'background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 3px,transparent 3px,transparent 5px)':''}"></i><u style="left:${markPos}%"></u></span>
    </button>`;
  });
  document.getElementById('side').innerHTML=h;
}

function viewApartado(){
  if(sel===''){
    const fs=S.fichas.filter(f=>!f.apartado);
    return `<div class="wide"><div class="mh"><div><div class="num">Buzón</div><h2>Sin clasificar</h2></div>
      <button class="btn" onclick="openFicha('')">+ ficha</button></div>
      <div class="info">Fichas que capturaste sin decidir a qué apartado pertenecen. Ábrelas y asígnalas cuando tengas cabeza para ordenar.</div>
      ${fichasHTML(fs)}</div>`;
  }
  const a=RUTAMAP[sel], m=metrica(sel), e=m.e;
  let fs=S.fichas.filter(f=>f.apartado===sel || (f.secundarios||[]).includes(sel));
  if(filtro) fs=fs.filter(f=>JSON.stringify(f).toLowerCase().includes(filtro.toLowerCase()));
  if(tipoFiltro) fs=fs.filter(f=>(f.fuente||{}).tipo===tipoFiltro);
  if(srcFiltro) fs=fs.filter(f=>fuenteKey(f)===srcFiltro);
  if(claseFiltro) fs=fs.filter(f=>(f.clase||'extracto')===claseFiltro);
  if(verFiltro) fs=fs.filter(f=>f.clase==='redaccion'?false:(verFiltro==='si'?!!f.verificada:!f.verificada));
  const markPos = m.meta? Math.min(m.mMin/(m.meta*1.35)*100,98):70;
  return `<div class="wide">
   <div class="mh">
     <div><div class="num">${a.id} · ${esc(a.sem)} · capítulo ${a.cap}</div>
     <h2>${esc(a.nom)}</h2></div>
     <div style="display:flex;gap:8px;flex-wrap:wrap">
       <button class="pill ${modoAp==='fichas'?'on':''}" onclick="modoAp='fichas';render()">Fichas</button>
       <button class="pill ${modoAp==='texto'?'on':''}" onclick="modoAp='texto';render()">Redacción${palabrasRed(a.id)?' · '+palabrasRed(a.id):''}</button>
       <span style="width:8px"></span>
       <button class="btn o sm" onclick="openAtoro('${a.id}')">marcar atoro</button>
       ${modoAp==='fichas'?`<button class="btn o sm" onclick="openFicha('${a.id}',null,null,{clase:'redaccion'})">+ nota suelta</button>
       <button class="btn" onclick="openFicha('${a.id}')">+ ficha</button>`
       :`<button class="btn o sm" onclick="copiarPlano('${a.id}')">copiar texto plano</button>
       <button class="btn" onclick="copiarRico('${a.id}')">copiar para Word</button>`}
     </div>
   </div>

   <div class="apgrid"><div class="apcol">
   <div class="info">
     ${gSec('que','Qué es', esc(a.que), esc(a.que))}
     ${gSec('como','Cómo se hace', esc(a.como), esc(a.como))}
     ${gSec('mide','Cuánto mide',
        `${e.min} a ${e.max} cuartillas · ideal ${e.ideal} · ${e.fue} fuentes recomendadas`,
        `${e.min}–${e.max} cuartillas`,
        `<span class="sello ${e.sello==='clase'?'clase':'prop'}">${e.sello==='clase'?'clase':'propuesta'}</span>`)}
     ${a.tips.length? gSec('tips','Notas de método',
        a.tips.map(t=>`<div class="tip"><b>${esc(t[0])}</b>${esc(t[1])}</div>`).join(''),
        a.tips.length+' nota'+(a.tips.length>1?'s':'')) : ''}
   </div>

   <div class="therm">
     <div class="tl"><span>material acopiado</span><span><b>${m.pal.toLocaleString('es-MX')}</b> de ${m.meta.toLocaleString('es-MX')} palabras</span></div>
     <div class="track ${m.est==='de-sobra'?'over':''}"><i style="width:${m.pct/1.35*100}%"></i><u style="left:${markPos}%"></u></div>
     <div class="tl"><span>respaldo</span><span><b>${m.fue}</b> de ${e.fue} fuentes distintas</span></div>
     <div class="track"><i style="width:${m.pctF/1.35*100}%"></i></div>
     <div class="tl"><span>redacción</span><span><b>${m.red}</b> de ${e.ideal} cuartillas</span></div>
     <div class="track"><i style="width:${m.pctR/1.35*100}%"></i></div>
     <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
       <span class="state ${m.est==='de-sobra'?'sobra':''}">${ESTLBL[m.est]}</span>
       <span class="redac">${m.nBor?`<b style="color:var(--accent)">${m.nBor} borrador${m.nBor>1?'es':''}</b> · `:''}escrito fuera de la app
         <input type="number" step="0.5" min="0" value="${m.redMan}" onchange="setRedac('${a.id}',this.value)"></span>
     </div>
   </div>
   </div>
   ${pendPanel(a.id)}
   </div>

   ${modoAp==='texto'? editorHTML(a) : `
   <div class="fh">
     <span class="h">Fichas · ${fs.length}</span>
     <span class="sp"></span>
     <input class="search" placeholder="buscar…" value="${esc(filtro)}" oninput="filtro=this.value;render()">
     <button class="pill ${claseFiltro===''?'on':''}" onclick="claseFiltro='';render()">todas</button>
     <button class="pill ${claseFiltro==='extracto'?'on':''}" onclick="claseFiltro='extracto';render()">extractos</button>
     <button class="pill ${claseFiltro==='redaccion'?'on':''}" onclick="claseFiltro='redaccion';render()">redacción</button>
     <span class="hint">·</span>
     <button class="pill ${verFiltro==='si'?'on':''}" onclick="verFiltro=(verFiltro==='si'?'':'si');render()">✓ verificadas</button>
     <button class="pill ${verFiltro==='no'?'on':''}" onclick="verFiltro=(verFiltro==='no'?'':'no');render()">⚠ sin verificar${(()=>{const n=S.fichas.filter(f=>(f.apartado===sel||(f.secundarios||[]).includes(sel))&&f.clase!=='redaccion'&&!f.verificada).length;return n?' · '+n:'';})()}</button>
     <span class="hint">·</span>
     <button class="pill ${tipoFiltro===''?'on':''}" onclick="tipoFiltro='';render()">todo tipo</button>
     ${TIPOS.slice(1).map(t=>`<button class="pill ${tipoFiltro===t[0]?'on':''}" onclick="tipoFiltro='${t[0]}';render()">${t[1]}</button>`).join('')}
   </div>
   ${srcFiltro?`<div class="avisofil">Viendo solo las fichas de <b>una fuente</b>
     <button onclick="srcFiltro='';render()">ver todas otra vez</button></div>`:''}
   ${fichasHTML(fs)}`}
  </div>`;
}

  const r=red(a.id);
  return `<div class="edwrap">
    <div class="edbar">
      <button class="btn o sm" onclick="abrirInsertar()">insertar cita</button>
      <span class="med" id="edMedidor"></span>
      <span class="sp"></span>
      <span class="hint" id="edAviso">${r.ts?'guardado':'sin escribir todavía'}</span>
    </div>
    <div class="edrea" id="edRed" contenteditable="true" spellcheck="true"
      data-ph="Escribe aquí el texto corrido de este apartado. Se guarda solo."></div>
    <div class="ednotas" id="edNotas"></div>
  </div>`;
}
/* =========================================================
   EL TÍTULO — siempre visible, y versionado
   ========================================================= */
function T(){ if(!S.titulo) { S.titulo=tituloDefault(); save(); } return S.titulo; }
function tActual(){ const t=T(); return (t.versiones[0]||{}).txt||''; }
function tFechaCambio(){ const t=T(); return (t.versiones[0]||{}).fecha||''; }
function pintarTitulo(){
  const b=document.getElementById('titBtn'); if(!b) return;
  const t=tActual(), n=T().versiones.length;
  b.title = t || 'Todavía no has puesto el título';
  b.innerHTML=`<span class="tl">Título</span>
    <span class="tt ${t?'':'vacio'}">${esc(t||'sin definir — le picas para ponerlo')}</span>
    ${n>1?`<span class="tv">v${n}</span>`:''}`;
}
let TT=null;
function openTitulo(){
  const t=T();
  TT={txt:tActual(), motivo:'', partes:JSON.parse(JSON.stringify(t.partes||{})), verHist:false};
  drawTitulo();
}
function cerrarTitulo(){ TT=null; document.getElementById('modalRoot').innerHTML=''; render(); }
function setParte(k,campo,v){
  TT.partes[k]=TT.partes[k]||{txt:'',nivel:1};
  TT.partes[k][campo]= campo==='nivel'?parseInt(v):v;
  if(campo==='nivel') drawTitulo();
}
function guardarTitulo(){
  const t=T(), nuevo=TT.txt.trim();
  if(!nuevo){ toast('El título no puede quedar vacío'); return; }
  t.partes=TT.partes;
  if(nuevo!==tActual()){
    t.versiones.unshift({id:uid(),txt:nuevo,fecha:new Date().toISOString(),motivo:TT.motivo.trim()});
    toast('Versión '+t.versiones.length+' guardada');
  } else toast('Guardado');
  save(); schedulePush(); cerrarTitulo();
}
function volverAVersion(vid){
  const t=T(), v=t.versiones.find(x=>x.id===vid); if(!v) return;
  if(window._volv!==vid){ window._volv=vid; toast('Toca otra vez para confirmar'); setTimeout(()=>window._volv=null,4000); return; }
  t.versiones.unshift({id:uid(),txt:v.txt,fecha:new Date().toISOString(),
    motivo:'Regresé a la versión del '+new Date(v.fecha).toLocaleDateString('es-MX')});
  save(); schedulePush(); TT.txt=v.txt; drawTitulo(); toast('Título restaurado');
}
function addConcepto(v){
  const c=(v||'').trim().toLowerCase(); if(!c) return;
  const t=T(); t.conceptos=t.conceptos||[];
  if(!t.conceptos.some(x=>x.txt===c)) t.conceptos.push({id:uid(),txt:c,estado:'por-definir'});
  save(); drawTitulo();
  setTimeout(()=>{const i=document.getElementById('cncIn'); if(i){i.value='';i.focus();}},10);
}
function cicloConcepto(cid){
  const t=T(), c=(t.conceptos||[]).find(x=>x.id===cid); if(!c) return;
  c.estado = c.estado==='por-definir'?'definido':(c.estado==='definido'?'descartado':'por-definir');
  save(); drawTitulo();
}
function borrarConcepto(cid){ const t=T(); t.conceptos=(t.conceptos||[]).filter(x=>x.id!==cid); save(); drawTitulo(); }

function drawTitulo(){
  const _y=guardaScroll();
  const t=T();
  const parte=(k)=>{
    const e=ESCALAS[k], p=TT.partes[k]||{txt:'',nivel:1};
    return `<div class="parte">
      <div class="pn">${e.nom}<span class="dnd">${e.donde}</span></div>
      <input class="in" value="${esc(p.txt)}" placeholder="cómo lo tienes hoy…"
        oninput="setParte('${k}','txt',this.value)">
      <div class="esc">${e.niv.map((n,i)=>{
        const nivel=i+1;
        const cls = nivel===p.nivel?'hoy':(nivel<p.nivel?'lleno':(nivel===e.meta?'meta':''));
        return `<button class="${cls}" onclick="setParte('${k}','nivel',${nivel})">${nivel}. ${n}</button>`;
      }).join('')}</div>
      <div class="escpie"><span>hoy: <b>${esc(e.niv[(p.nivel||1)-1])}</b></span>
        <span>${p.nivel>=e.meta?'ya llegaste a la meta':'meta: '+esc(e.niv[e.meta-1])}</span></div>
    </div>`;
  };
  const cambio = TT.txt.trim()!==tActual();
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)cerrarTitulo()">
   <div class="modal" style="max-width:660px">
    <div class="mtop"><b>El título</b>
      <span class="apto">versión ${t.versiones.length}</span>
      <button class="x" onclick="cerrarTitulo()">✕</button></div>
    <div class="mbody">

      <div class="tsec">
        <div class="h">Título vigente</div>
        <textarea class="in tall" style="min-height:66px" oninput="TT.txt=this.value">${esc(TT.txt)}</textarea>
        ${cambio?`<div class="fld" style="margin-top:10px;margin-bottom:0">
          <label><span class="op">opcional</span> Por qué lo cambiaste
            <span class="hintl">una línea — vale mucho en revisión</span></label>
          <input class="in" placeholder="La maestra pidió…, la investigación mostró que…"
            oninput="TT.motivo=this.value" value="${esc(TT.motivo)}"></div>`
        :`<div class="hint" style="margin-top:7px">Si lo cambias, se guarda como versión nueva sin borrar la anterior.</div>`}
      </div>

      <div class="tsec">
        <div class="h">Sus tres partes <span class="r">qué tan lejos estás de la especificidad que necesitas</span></div>
        ${parte('que')}${parte('quien')}${parte('donde')}
        <div class="hint" style="margin-top:4px">El nivel lo marcas tú. No es calificación: es saber a dónde tienes que llegar y en qué apartado se resuelve.</div>
      </div>

      <div class="tsec">
        <div class="h">Conceptos que salen del título <span class="r">guía, no obligación</span></div>
        <div class="cnc">${(t.conceptos||[]).map(c=>
          `<button class="${c.estado==='definido'?'def':(c.estado==='descartado'?'desc':'')}"
            onclick="cicloConcepto('${c.id}')" oncontextmenu="event.preventDefault();borrarConcepto('${c.id}')"
            title="clic para cambiar estado · clic derecho para borrar">${esc(c.txt)}</button>`).join('')}
        </div>
        <input class="in" id="cncIn" style="margin-top:9px" placeholder="agregar concepto y Enter…"
          onkeydown="if(event.key==='Enter'){event.preventDefault();addConcepto(this.value)}">
        <div class="hint" style="margin-top:7px">Son los que hay que definir en 1.1. Si alguno no tiene respaldo académico,
          esa es señal legítima de mover el título — no de forzar la definición.</div>
      </div>

      <div class="tsec" style="margin-bottom:0">
        <div class="h">Historial
          <button class="r" style="color:var(--accent)" onclick="TT.verHist=${TT.verHist?'false':'true'};drawTitulo()">
            ${TT.verHist?'ocultar':'ver las '+t.versiones.length+' versiones'}</button></div>
        ${TT.verHist? t.versiones.map((v,i)=>`<div class="ver ${i===0?'act':''}">
            <div class="vf">${i===0?'vigente · ':''}${new Date(v.fecha).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})}</div>
            <div class="vt">${esc(v.txt)}</div>
            ${v.motivo?`<div class="vm">${esc(v.motivo)}</div>`:''}
            ${i>0?`<button class="vb" onclick="volverAVersion('${v.id}')">volver a esta</button>`:''}
          </div>`).join('')
        :`<div class="hint">La versión vigente es del ${new Date(tFechaCambio()).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})}.</div>`}
      </div>

    </div>
    <div class="mfoot">
      <button class="btn" onclick="guardarTitulo()">${cambio?'guardar como versión nueva':'guardar'}</button>
      <button class="btn g" onclick="cerrarTitulo()">cancelar</button>
      <span class="sp"></span><span class="hint">Esc para cerrar</span>
    </div>
   </div></div>`;
  devuelveScroll(_y); autoAltoTodo();
}

/* =========================================================
   PENDIENTES POR APARTADO
   Lo que TÚ te propones hacer o buscar. Distinto de "atorados",
   que es lo que ya buscaste y no salió.
   ========================================================= */
function pends(id){ S.pendientes=S.pendientes||{}; return S.pendientes[id]||[]; }
function pendAbiertos(id){ return pends(id).filter(p=>p.estado==='pendiente').length + compsDe(id).length; }
function addPend(id,txt){
  const t=(txt||'').trim(); if(!t) return;
  S.pendientes=S.pendientes||{}; S.pendientes[id]=S.pendientes[id]||[];
  S.pendientes[id].unshift({id:uid(),txt:t,estado:'pendiente',creada:new Date().toISOString()});
  save(); schedulePush(); render();
  setTimeout(()=>{ const i=document.getElementById('pendIn'); if(i){ i.value=''; i.focus(); } },10);
}
function pendEstado(ap,pid,e){
  const p=pends(ap).find(x=>x.id===pid); if(!p) return;
  p.estado = p.estado===e ? 'pendiente' : e;
  save(); schedulePush(); render();
}
function pendBorrar(ap,pid){
  S.pendientes[ap]=pends(ap).filter(x=>x.id!==pid); save(); schedulePush(); render();
}
function pendAtoro(ap,pid){
  const p=pends(ap).find(x=>x.id===pid); if(!p) return;
  S.atorados.unshift({id:uid(), titulo:p.txt, apartado:ap, terminos:'', causa:'nada',
    notas:'venía de mis pendientes', estado:'pendiente',
    fecha:new Date().toLocaleDateString('es-MX',{day:'numeric',month:'short'})});
  S.pendientes[ap]=pends(ap).filter(x=>x.id!==pid);
  save(); schedulePush(); render(); toast('Pasó a Atorados. Múevete al siguiente.');
}
function pendPanel(ap){
  const todos=pends(ap);
  const abiertos=todos.filter(p=>p.estado==='pendiente');
  const cerrados=todos.filter(p=>p.estado!=='pendiente');
  const ver=S.ui.verHechos!==false;
  const fila=p=>`<div class="prow ${p.estado==='hecho'?'done':(p.estado==='na'?'na':'')}">
      <button class="ck" title="marcar como hecho" onclick="pendEstado('${ap}','${p.id}','hecho')"></button>
      <span class="tx">${esc(p.txt)}</span>
      <span class="pacts">
        ${p.estado==='pendiente'?`<button class="at" onclick="pendAtoro('${ap}','${p.id}')" title="lo intenté y no salió">no salió</button>`:''}
        <button onclick="pendEstado('${ap}','${p.id}','na')">${p.estado==='na'?'reactivar':'ya no aplica'}</button>
        <button onclick="pendBorrar('${ap}','${p.id}')">✕</button>
      </span></div>`;
  return `<div class="pend">
    <div class="ph"><b>Pendientes</b>
      ${(abiertos.length+compsDe(ap).length)?`<span class="n">${abiertos.length+compsDe(ap).length} por hacer</span>`:'<span class="n" style="color:var(--muted)">al corriente</span>'}</div>
    <div class="pin">
      <input class="in" id="pendIn" placeholder="buscar la definición de…, preguntarle a…"
        onkeydown="if(event.key==='Enter'){event.preventDefault();addPend('${ap}',this.value)}">
    </div>
    <div class="plist">
      ${compsDe(ap).map(c=>`<div class="prow comp">
        <span class="ck comp" title="viene de una asesoría"></span>
        <span class="tx">${esc(c.txt)}
          <span class="deq">de la asesoría del ${esc(fechaLarga(c.fecha))}</span></span>
        <span class="pacts"><button onclick="cicloComp('${c.aid}',${c.i})">cumplido</button></span>
      </div>`).join('')}
      ${abiertos.length?abiertos.map(fila).join(''):
        (compsDe(ap).length?'':`<div class="pvacio">Aquí van las cosas que se te ocurren mientras trabajas: qué falta buscar, qué preguntarle a la maestra, qué revisar después.<br><br>Escribe y Enter. Nada más.</div>`)}
      ${cerrados.length&&ver?cerrados.map(fila).join(''):''}
    </div>
    ${cerrados.length?`<button class="pmas" onclick="S.ui.verHechos=${ver?'false':'true'};save();render()">
      ${ver?'ocultar':'ver'} ${cerrados.length} cerrado${cerrados.length>1?'s':''}</button>`:''}
  </div>`;
}

/* guía plegable — el estado se recuerda para todos los apartados */
function gOpen(k){
  if(!S.ui.guia) S.ui.guia={que:true,como:true,mide:true,tips:true};
  return S.ui.guia[k]!==false;
}
function gToggle(k){ const o=gOpen(k); S.ui.guia[k]=!o; save(); render(); }
function gSec(k,titulo,contenido,peek,extra){
  const ab=gOpen(k);
  return `<button class="lbt ${ab?'':'closed'}" onclick="gToggle('${k}')">
      <span class="car">▼</span>${titulo}${extra||''}
      ${ab?'':`<span class="pk">${peek}</span>`}</button>
    ${ab?`<div class="gtx">${contenido}</div>`:''}`;
}
function setRedac(id,v){ S.redaccion[id]=parseFloat(v)||0; save(); render(); schedulePush(); }

/* fichas capturadas antes del último cambio de título */
function viejaTitulo(f){
  const t=S.titulo; if(!t||!t.versiones||t.versiones.length<2) return false;
  const v=t.versiones[0];
  return !!f.creada && f.creada < v.fecha && f.revTitulo!==v.id;
}
function revisada(id){
  const f=S.fichas.find(x=>x.id===id); if(!f) return;
  f.revTitulo=T().versiones[0].id; save(); schedulePush(); render();
}
/* lista de fuentes ya capturadas, para no volver a escribirlas */
function fuentesUnicas(){
  const m={};
  S.fichas.forEach(f=>{ const k=fuenteKey(f); if(!k||m[k])return;
    const s=f.fuente||{};
    const et=[s.autor,(s.titulo||s.refCruda||'').slice(0,70),s.anio].filter(Boolean).join(' · ');
    m[k]={k, s, et:et||'(sin datos)'}; });
  return Object.values(m).sort((a,b)=>a.et.localeCompare(b.et,'es'));
}
function usarFuenteExistente(k){
  if(!k) return;
  const f=S.fichas.find(x=>fuenteKey(x)===k); if(!f) return;
  M.fuente=JSON.parse(JSON.stringify(f.fuente||{tipo:'generica'}));
  M.auto={};
  if(!M.archivo && f.archivo) M.archivo=f.archivo;
  if(!M.confiabilidad && f.confiabilidad) M.confiabilidad=f.confiabilidad;
  M.banner=['ok','<b>Fuente tomada de tus fichas.</b> Si la corriges aquí, solo cambia en esta ficha — para cambiarla en todas, hazlo desde Bibliografía.'];
  drawModal();
}
function citarFuente(k){
  if(!k) return;
  const f=S.fichas.find(x=>fuenteKey(x)===k); if(!f) return;
  M.fuentes=M.fuentes||[];
  if(M.fuentes.some(s=>fuenteKey({fuente:s})===k)){ toast('Esa fuente ya está citada'); return; }
  M.fuentes.push(JSON.parse(JSON.stringify(f.fuente)));
  drawModal();
}
function quitarCita(i){ M.fuentes.splice(i,1); drawModal(); }
function otraRedaccion(id){
  const f=S.fichas.find(x=>x.id===id); if(!f) return;
  openFicha(f.apartado,null,null,{clase:'redaccion',tags:f.tags,archivo:f.archivo,
    confiabilidad:f.confiabilidad, fuentes:(f.fuentes||[]), secundarios:f.secundarios});
}
/* marcar verificada desde la tarjeta, sin abrir la ficha */
function marcarVerif(id, v){
  const f=S.fichas.find(x=>x.id===id); if(!f) return;
  f.verificada=!!v; save(); schedulePush(); render();
  toast(v?'Verificada — ya es citable':'Marcada como sin verificar');
}

/* cuántas fichas comparten la misma fuente */
function hermanas(f){ const k=fuenteKey(f); if(!k) return 1;
  return S.fichas.filter(x=>fuenteKey(x)===k).length; }
function verFuente(k){ srcFiltro=(srcFiltro===k?'':k); render(); }

      ${f.paraQue?`<div class="parq">↳ ${esc(f.paraQue)}</div>`:''}

      <div class="src" ${(bor && !s.autor && !s.titulo && !s.refCruda)?'style="display:none"':''}>

        ${hermanas(f)>1?`<button class="nfu" onclick="verFuente('${esc(fuenteKey(f))}')"
          title="ver las ${hermanas(f)} fichas de esta fuente">${hermanas(f)} fichas</button>`:''}
      </div>
      <div class="ft">
        <span>${words(f.extracto)} palabras</span>
        ${f.pagina?'<span>· p. '+esc(f.pagina)+'</span>':''}
        ${f.apartado?'<span>· '+f.apartado+'</span>':'<span>· sin clasificar</span>'}
        <span class="sp"></span>
        ${f.archivo?`<a href="${esc(f.archivo)}${f.pagina?'#page='+encodeURIComponent(f.pagina):''}" target="_blank" rel="noopener" style="color:var(--accent)">abrir documento</a>`:''}
        <button onclick="openFicha(null,'${f.id}')">editar</button>
        ${bor?`<button onclick="vaciarFichaAlTexto('${f.id}')">pasar al texto</button>
               <button onclick="otraRedaccion('${f.id}')">otra igual</button>`
             :`<button onclick="dupFicha('${f.id}')">otra de esta fuente</button>

  if(!S.atorados.length) h+=`<div class="empty">Nada atorado todavía.<br><br>Cuando una búsqueda no dé después de 20 minutos, márcala aquí y múevete al siguiente apartado.</div>`;
  CAUSAS.forEach(([k,lbl,sub])=>{
    const list=S.atorados.filter(a=>a.causa===k);

    h+=`<div class="capt" style="margin:22px 0 9px">${lbl} — <span style="color:var(--accent)">${sub}</span></div>`;

      const cls=a.estado==='resuelto'?'r':(a.estado==='claude'?'c':'p');

        <div class="m">${a.terminos?'Busqué <code>'+esc(a.terminos)+'</code> · ':''}${esc(a.notas||'')}${a.fecha?' · '+esc(a.fecha):''}</div>

function cicloAtoro(id){ const a=S.atorados.find(x=>x.id===id); if(!a)return;
  a.estado = a.estado==='pendiente'?'claude':(a.estado==='claude'?'resuelto':'pendiente'); save(); render(); schedulePush(); }
function delAtoro(id){ S.atorados=S.atorados.filter(x=>x.id!==id); save(); render(); schedulePush(); }
function copiarAtorados(){
  const pend=S.atorados.filter(a=>a.estado!=='resuelto');
  if(!pend.length){ toast('No hay atorados pendientes'); return; }
  let t='ATORADOS DE MI PROTOCOLO DE TESIS\n(lo que ya busqué y no salió — no repitas estas búsquedas)\n\n';
  CAUSAS.forEach(([k,lbl])=>{
    const l=pend.filter(a=>a.causa===k); if(!l.length)return;
    t+= lbl.toUpperCase()+'\n';
    l.forEach(a=>{ t+=`- [${a.apartado||'sin apartado'}] ${a.titulo}`;
      if(a.terminos) t+=`\n  términos usados: ${a.terminos}`;
      if(a.notas) t+=`\n  nota: ${a.notas}`;
      t+='\n'; });
    t+='\n';
  });
  copiar(t); toast('Lista copiada — pégamela en el chat');
}


/* =========================================================
   EDITAR UNA FUENTE — cambia en todas sus fichas de golpe
   La fuente vive copiada dentro de cada ficha, así que editar
   aquí reescribe el bloque de fuente de todas las que comparten
   la misma clave. Así ninguna se despega de sus hermanas.
   ========================================================= */
let F=null;
function fichasDeFuente(k){ return S.fichas.filter(f=>fuenteKey(f)===k); }
function openFuente(k){
  const fs=fichasDeFuente(k); if(!fs.length){ toast('Esa fuente ya no tiene fichas'); return; }
  const base=fs[0];
  F={key:k, s:JSON.parse(JSON.stringify(base.fuente||{tipo:'generica'})),
     conf:base.confiabilidad||'', archivo:base.archivo||'', n:fs.length, merge:''};
  drawFuente();
}
function cerrarFuente(){ F=null; document.getElementById('modalRoot').innerHTML=''; render(); }
function setF(k,v){ F.s[k]=v; }
function setFtipo(t){ F.s.tipo=t; drawFuente(); }
function guardarFuente(){
  const fs=fichasDeFuente(F.key);
  fs.forEach(f=>{ f.fuente=JSON.parse(JSON.stringify(F.s));
    if(F.conf) f.confiabilidad=F.conf;
    if(F.archivo) f.archivo=F.archivo; });
  actualizarCitas(F.key, F.s);
  save(); schedulePush(); cerrarFuente(); toast('Fuente actualizada en '+fs.length+' ficha'+(fs.length>1?'s':''));
}
function unirFuente(){
  if(!F.merge || F.merge===F.key){ toast('Elige con cuál unirla'); return; }
  if(window._unir!==F.merge){ window._unir=F.merge; toast('Toca otra vez para confirmar la unión'); setTimeout(()=>window._unir=null,5000); return; }
  const otras=fichasDeFuente(F.merge);
  otras.forEach(f=>{ f.fuente=JSON.parse(JSON.stringify(F.s));
    if(F.conf&&!f.confiabilidad) f.confiabilidad=F.conf;
    if(F.archivo&&!f.archivo) f.archivo=F.archivo; });
  fichasDeFuente(F.key).forEach(f=>{ f.fuente=JSON.parse(JSON.stringify(F.s)); });
  actualizarCitas(F.key, F.s); actualizarCitas(F.merge, F.s);
  save(); schedulePush(); const n=otras.length; cerrarFuente();
  toast(n+' ficha'+(n>1?'s':'')+' se unieron a esta fuente');
}
/* las redacciones guardan copias de las fuentes que citan:
   al editar una fuente hay que actualizarlas también */
function actualizarCitas(clave, nueva){
  S.fichas.forEach(f=>{
    if(!f.fuentes||!f.fuentes.length) return;
    f.fuentes=f.fuentes.map(s=>fuenteKey({fuente:s})===clave? JSON.parse(JSON.stringify(nueva)) : s);
  });
}
function rowsCamposF(campos,s){
  let h='', buf=[];
  const flush=()=>{ if(!buf.length)return; h+= buf.length>1?`<div class="two">${buf.join('')}</div>`:buf[0]; buf=[]; };
  campos.forEach(c=>{
    const [k,lbl,req,sz]=c;
    const fld=`<div class="fld"><label>${req?'<span class="req">obligatorio</span>':'<span class="op">opc.</span>'} ${lbl}</label>
      <input class="in" value="${esc(s[k]||'')}" oninput="setF('${k}',this.value)"></div>`;
    if(sz==='sm'){ buf.push(fld); if(buf.length>=3) flush(); } else { flush(); h+=fld; }
  });
  flush(); return h;
}
function drawFuente(){
  const _y=guardaScroll();
  const s=F.s, campos=CAMPOS[s.tipo]||CAMPOS.generica;
  const otras=[]; const vistos={};
  S.fichas.forEach(f=>{ const k=fuenteKey(f); if(!k||k===F.key||vistos[k])return; vistos[k]=1;
    otras.push({k, txt:(f.fuente.autor||'')+' · '+(f.fuente.titulo||f.fuente.refCruda||'sin título')}); });
  const aps=[...new Set(fichasDeFuente(F.key).map(f=>f.apartado).filter(Boolean))].sort();

  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)cerrarFuente()">
   <div class="modal" style="max-width:600px">
    <div class="mtop"><b>Editar la fuente</b>
      <span class="apto">${F.n} ficha${F.n>1?'s':''}${aps.length?' · '+aps.join(' · '):''}</span>
      <button class="x" onclick="cerrarFuente()">✕</button></div>
    <div class="mbody">
      <div class="banner lo"><span>⋯</span><span>Lo que cambies aquí se aplica a <b>las ${F.n} fichas</b> de esta fuente. Los extractos no se tocan.</span></div>

      <div class="grp"><div class="gl">Tipo</div>
        <div class="fld"><div class="chips">${TIPOS.map(t=>
          `<button class="chip ${s.tipo===t[0]?'on':''}" onclick="setFtipo('${t[0]}')">${t[1]}</button>`).join('')}</div></div>

        ${s.refCruda!==undefined?`<div class="fld">
          <label><span class="auto">pegada</span> Referencia completa</label>
          <textarea class="in auto" oninput="setF('refCruda',this.value);autoAlto(this)">${esc(s.refCruda||'')}</textarea>
          <div class="chips" style="margin-top:8px">
            <button class="chip ${s.usarCruda?'on':''}" onclick="setF('usarCruda',true);drawFuente()">usarla tal cual</button>
            <button class="chip ${s.usarCruda?'':'on'}" onclick="setF('usarCruda',false);drawFuente()">armarla con los campos</button>
          </div></div>`:''}

        ${rowsCamposF(campos,s)}
        ${bibkeyFld(s,'F')}
      </div>

      <div class="grp"><div class="gl">Se aplica a todas <span class="r">— solo si lo llenas</span></div>
        <div class="fld"><label>Confiabilidad</label>
          <div class="chips">${['Alta','Media','Baja'].map(c=>
            `<button class="chip ${F.conf===c?'on':''}" onclick="F.conf=(F.conf==='${c}'?'':'${c}');drawFuente()">${c}</button>`).join('')}</div></div>
        <div class="fld" style="margin-bottom:0"><label><span class="op">opc.</span> Liga al documento</label>
          <input class="in" value="${esc(F.archivo)}" placeholder="https://drive.google.com/…" oninput="F.archivo=this.value"></div>
      </div>

      ${otras.length?`<div class="grp" style="margin-bottom:0"><div class="gl">Unir con otra fuente
        <span class="r">— si la capturaste dos veces distinto</span></div>
        <select class="in" onchange="F.merge=this.value">
          <option value="">elegir la fuente duplicada…</option>
          ${otras.map(o=>`<option value="${esc(o.k)}">${esc(o.txt.slice(0,90))}</option>`).join('')}
        </select>
        <button class="btn g sm" style="margin-top:9px" onclick="unirFuente()">unir a esta</button>
        <div class="hint" style="margin-top:6px">Las fichas de la otra fuente pasan a tener <b>esta</b> fuente. No se borra ninguna ficha.</div>
      </div>`:''}
    </div>
    <div class="mfoot">
      <button class="btn" onclick="guardarFuente()">guardar en las ${F.n} fichas</button>
      <button class="btn g" onclick="cerrarFuente()">cancelar</button>
      <span class="sp"></span><span class="hint">Esc para cerrar</span>
    </div>
   </div></div>`;
  devuelveScroll(_y); autoAltoTodo();
}

/* ---------- bibliografía ---------- */
function viewBiblio(){
  const map={};
  S.fichas.forEach(f=>{ const k=fuenteKey(f); if(!k)return;
    if(!map[k]) map[k]={k, s:f.fuente||{},n:0}; map[k].n++; });
  const refs=Object.values(map);
  const inc=refs.filter(r=>faltan(r.s).length).length;
  refs.sort((a,b)=>(a.s.autor||'zz').localeCompare(b.s.autor||'zz','es'));
  let h=`<div class="wide"><div class="mh">
    <div><h2>Bibliografía</h2><div class="hint" style="margin-top:4px">Estilo Chicago, sistema notas-bibliografía. Ordenada por apellido.</div></div>
    <button class="btn" onclick="copiarBiblio()">copiar todo</button></div>
    <div class="bstat">
      <div><b>${refs.length}</b>fuentes</div>
      <div><b>${refs.length-inc}</b>completas</div>
      <div class="w"><b>${inc}</b>les falta un dato</div>
      <div><b>${S.fichas.length}</b>fichas</div>
    </div>`;
  if(!refs.length) h+=`<div class="empty">La bibliografía se arma sola con las fuentes de tus fichas.<br>Todavía no hay ninguna.</div>`;
  refs.forEach(r=>{
    const fal=faltan(r.s);
    h+=`<div class="ref ${fal.length?'inc':''}">
      <div class="txt">${chicago(r.s)}${r.s.bibkey?`<button class="bk" title="copiar la clave para LaTeX" onclick="copiar('${esc(r.s.bibkey)}');toast('Clave copiada')">${esc(r.s.bibkey)}</button>`:'<span class="bk sin">sin clave</span>'}
        <div class="rule">${fal.length?'⚠ Le falta: '+fal.join(', ')+'. Complétala antes de usarla.':(REGLAS[r.s.tipo]||REGLAS.generica)}</div></div>
      <div class="used">${r.n} ficha${r.n>1?'s':''}<br>
        <button style="color:var(--accent);font-size:10.5px" onclick="openFuente('${esc(r.k)}')">editar</button></div></div>`;
  });
  h+=`<div style="border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-top:22px;background:var(--panel)">
    <div class="capt">Los patrones de Chicago que usa la app</div>
    <table class="ext">${Object.entries(REGLAS).map(([k,v])=>
      `<tr><td style="width:100px;color:var(--accent);font-weight:500">${(TIPOS.find(t=>t[0]===k)||['',k])[1]}</td><td>${v}</td></tr>`).join('')}</table>
    <div class="hint" style="margin-top:12px">Chicago tiene dos sistemas: notas-bibliografía (éste) y autor-fecha. No son intercambiables. Confírmalo con la maestra — el cambio se hace en Ajustes sin rehacer ninguna ficha.</div>
  </div></div>`;
  return h;
}
function copiarBiblio(){
  const map={}; S.fichas.forEach(f=>{const k=fuenteKey(f); if(!k)return; if(!map[k])map[k]=f.fuente||{};});
  const l=Object.values(map).sort((a,b)=>(a.autor||'zz').localeCompare(b.autor||'zz','es'))
    .map(s=>chicago(s).replace(/<\/?i>/g,''));
  if(!l.length){ toast('No hay fuentes todavía'); return; }
  copiar(l.join('\n')); toast(l.length+' referencias copiadas');
}

/* aviso de duplicado — no bloquea, solo avisa */

  if(!M || M.fija || M.clase==='redaccion') return '';

  if(!(s.autor||s.titulo||s.liga)) return '';
  const k=fuenteKey({fuente:s});
  const otras=S.fichas.filter(f=>f.id!==M.id && fuenteKey(f)===k);
  if(!otras.length) return '';
